name: Release Vuepyter

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vuepyter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vuepyter/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install package dependencies
        working-directory: vuepyter
        run: npm ci

      - name: Read package metadata
        id: package
        working-directory: vuepyter
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: registry
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium
        working-directory: vuepyter
        run: npx playwright install --with-deps chromium

      - name: Run typecheck
        working-directory: vuepyter
        run: npm run typecheck

      - name: Run unit and component tests
        working-directory: vuepyter
        run: npm test

      - name: Build package
        working-directory: vuepyter
        run: npm run build

      - name: Validate npm package contents
        working-directory: vuepyter
        run: npm run pack:check

      - name: Lint package exports
        working-directory: vuepyter
        run: npm run lint:pkg

      - name: Validate published types
        working-directory: vuepyter
        run: npm run lint:types

      - name: Run end-to-end tests
        working-directory: vuepyter
        run: npm run test:e2e

      - name: Publish to npm
        if: github.event_name == 'push' && steps.registry.outputs.should_publish == 'true'
        working-directory: vuepyter
        run: npm publish --provenance --access public

      - name: Skip publish because version already exists
        if: github.event_name == 'push' && steps.registry.outputs.should_publish != 'true'
        run: echo "Skipping npm publish because ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} already exists."
