<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vuepyter NN Visualizer Example</title>
  <link rel="stylesheet" href="../../vuepyter/dist/vuepyter.css" />
  <style>
    :root {
      --app-gap: 0.75rem;
      --app-pad: 0.75rem;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    #app {
      height: 100%;
    }

    .page {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--left-pane-width, calc(50vw - 18px)) 10px minmax(0, 1fr);
      gap: var(--app-gap);
      padding: var(--app-pad);
      box-sizing: border-box;
    }

    .left-pane,
    .right-pane {
      min-height: 0;
      min-width: 0;
    }

    .editor-fill {
      height: 100%;
    }

    .splitter {
      position: relative;
      border-radius: 999px;
      background: #d1d5db;
      cursor: col-resize;
      touch-action: none;
    }

    .splitter::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 40px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: #9ca3af;
    }

    .left-pane-card {
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
      overflow: hidden;
      border-radius: 0.7rem;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06);
    }

    body.is-resizing,
    body.is-resizing * {
      user-select: none;
      cursor: col-resize !important;
    }

    @media (max-width: 960px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .splitter {
        display: none;
      }

      .left-pane {
        display: block;
        height: 340px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="module">
    import { createApp, ref, computed, onBeforeUnmount, onMounted } from 'vue'
    import { Vuepyter } from '/vuepyter/dist/index.mjs'

    const NOTEBOOK_URL = './nn-visualizer.ipynb'
    const DESKTOP_BREAKPOINT = 960

    const app = createApp({
      components: {
        Vuepyter,
      },
      setup() {
        const notebook = ref({
          nbformat: 4,
          nbformat_minor: 5,
          metadata: {},
          cells: [],
        })
        const leftPaneWidth = ref(
          typeof window === 'undefined' ? 380 : Math.max(380, Math.floor((window.innerWidth - 24) / 2)),
        )
        const resizing = ref(false)

        const editorTheme = {
          '--vuepyter-bg': '#ffffff',
          '--vuepyter-cell-bg': '#ffffff',
        }

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value))
        }

        function calculateBounds() {
          const totalWidth = window.innerWidth - 2 * 12
          const minLeft = 280
          const minRight = 420
          const maxLeft = Math.max(minLeft, totalWidth - minRight)
          return { minLeft, maxLeft }
        }

        function calculateDefaultSplit() {
          if (window.innerWidth <= DESKTOP_BREAKPOINT) {
            return leftPaneWidth.value
          }
          const { minLeft, maxLeft } = calculateBounds()
          const totalWidth = window.innerWidth - 2 * 12
          return clamp(totalWidth / 2, minLeft, maxLeft)
        }

        function onPointerMove(event) {
          if (!resizing.value || window.innerWidth <= DESKTOP_BREAKPOINT) {
            return
          }

          const { minLeft, maxLeft } = calculateBounds()
          leftPaneWidth.value = clamp(event.clientX - 12, minLeft, maxLeft)
        }

        function stopResize() {
          resizing.value = false
          document.body.classList.remove('is-resizing')
          window.removeEventListener('pointermove', onPointerMove)
          window.removeEventListener('pointerup', stopResize)
        }

        function startResize(event) {
          if (window.innerWidth <= DESKTOP_BREAKPOINT) {
            return
          }
          event.preventDefault()
          resizing.value = true
          document.body.classList.add('is-resizing')
          window.addEventListener('pointermove', onPointerMove)
          window.addEventListener('pointerup', stopResize)
        }

        function resetSplit() {
          leftPaneWidth.value = calculateDefaultSplit()
        }

        function onWindowResize() {
          if (window.innerWidth <= DESKTOP_BREAKPOINT) {
            return
          }
          const { minLeft, maxLeft } = calculateBounds()
          leftPaneWidth.value = clamp(leftPaneWidth.value, minLeft, maxLeft)
        }

        async function loadNotebook() {
          try {
            const response = await fetch(NOTEBOOK_URL, { cache: 'no-store' })
            if (!response.ok) {
              throw new Error(`Failed to load ${NOTEBOOK_URL}: ${response.status}`)
            }
            const data = await response.json()
            if (!data || typeof data !== 'object' || !Array.isArray(data.cells)) {
              throw new Error('Invalid notebook format')
            }
            notebook.value = data
          } catch (error) {
            console.error(error)
          }
        }

        const pageStyle = computed(() => ({
          '--left-pane-width': `${leftPaneWidth.value}px`,
        }))

        onMounted(() => {
          if (window.innerWidth > DESKTOP_BREAKPOINT) {
            leftPaneWidth.value = calculateDefaultSplit()
          }
          window.addEventListener('resize', onWindowResize)
          void loadNotebook()
        })

        onBeforeUnmount(() => {
          stopResize()
          window.removeEventListener('resize', onWindowResize)
        })

        return {
          notebook,
          editorTheme,
          pageStyle,
          startResize,
          resetSplit,
        }
      },
      template: `
          <main class="page" :style="pageStyle">
            <section class="left-pane">
              <section class="left-pane-card" aria-label="NN visualizer"></section>
            </section>

            <div
              class="splitter"
              role="separator"
              aria-label="Resize panes"
              aria-orientation="vertical"
              @pointerdown="startResize"
              @dblclick="resetSplit"
            />

            <section class="right-pane">
              <Vuepyter
                class="editor-fill"
                v-model="notebook"
                :autosave-interval="1000"
                :pyodide-packages="['numpy']"
                :theme="editorTheme"
              />
            </section>
          </main>
        `,
    })

    app.mount('#app')
  </script>
</body>

</html>
