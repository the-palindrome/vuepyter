import json


def __vuepyter_is_graph_like__(value):
    if value is None or isinstance(value, type):
        return False
    try:
        nodes = getattr(value, "nodes")
        edges = getattr(value, "edges")
    except Exception:
        return False

    try:
        iter(nodes)
        iter(edges)
    except Exception:
        return False

    return True


def __vuepyter_is_camera_like__(value):
    if value is None or isinstance(value, type):
        return False
    if not callable(getattr(value, "move_to", None)):
        return False
    try:
        center = getattr(value, "center")
        height = getattr(value, "height")
    except Exception:
        return False
    if center is None:
        return False
    try:
        float(height)
    except Exception:
        return False
    return True


def __vuepyter_iter_items__(value, limit=512):
    if value is None:
        return []

    if isinstance(value, dict):
        source = value.values()
    elif isinstance(value, (list, tuple, set, frozenset)):
        source = value
    else:
        try:
            source = value
            iter(source)
        except Exception:
            return []

    out = []
    for index, item in enumerate(source):
        if index >= limit:
            break
        out.append(item)
    return out


def __vuepyter_walk_for_graphs__(value, path, depth, seen, out):
    if depth < 0:
        return

    key = id(value)
    if key in seen:
        return
    seen.add(key)

    if __vuepyter_is_graph_like__(value):
        out.append((path, value))
        return

    if isinstance(value, dict):
        for index, (item_key, item_value) in enumerate(list(value.items())[:64]):
            child_path = f"{path}.{item_key}" if path else str(item_key)
            __vuepyter_walk_for_graphs__(item_value, child_path, depth - 1, seen, out)
            if index >= 63:
                break
        return

    if isinstance(value, (list, tuple, set, frozenset)):
        for index, item in enumerate(list(value)[:64]):
            child_path = f"{path}[{index}]"
            __vuepyter_walk_for_graphs__(item, child_path, depth - 1, seen, out)
        return


def __vuepyter_parse_display_label__(raw):
    if raw is None:
        return None
    if isinstance(raw, bool):
        return raw
    if isinstance(raw, (int, float)):
        return bool(raw)
    if isinstance(raw, str):
        lowered = raw.strip().lower()
        if lowered in ("true", "1", "yes", "y", "on"):
            return True
        if lowered in ("false", "0", "no", "n", "off"):
            return False
    return None


def __vuepyter_parse_node_metadata__(raw):
    metadata = getattr(raw, "metadata", None)
    color = getattr(metadata, "color", None)
    size = getattr(metadata, "size", None)
    display_label = __vuepyter_parse_display_label__(getattr(metadata, "display_label", None))

    if color is not None:
        try:
            color = str(color).strip()
        except Exception:
            color = None
        if not color:
            color = None

    if size is not None:
        try:
            size = float(size)
        except Exception:
            size = None

    return color, size, display_label


def __vuepyter_parse_edge_metadata__(raw):
    metadata = getattr(raw, "metadata", None)
    color = getattr(metadata, "color", None)
    width = getattr(metadata, "width", None)
    if width is None:
        width = getattr(metadata, "size", None)
    display_label = __vuepyter_parse_display_label__(getattr(metadata, "display_label", None))

    if color is not None:
        try:
            color = str(color).strip()
        except Exception:
            color = None
        if not color:
            color = None

    if width is not None:
        try:
            width = float(width)
        except Exception:
            width = None

    return color, width, display_label


def __vuepyter_parse_pos__(raw_pos):
    if raw_pos is None:
        return None

    if isinstance(raw_pos, (list, tuple)) and len(raw_pos) >= 2:
        try:
            return [float(raw_pos[0]), float(raw_pos[1])]
        except Exception:
            return None

    if isinstance(raw_pos, dict):
        x = raw_pos.get("x")
        y = raw_pos.get("y")
        if x is not None and y is not None:
            try:
                return [float(x), float(y)]
            except Exception:
                return None

    x = getattr(raw_pos, "x", None)
    y = getattr(raw_pos, "y", None)
    if x is not None and y is not None:
        try:
            return [float(x), float(y)]
        except Exception:
            return None

    return None


def __vuepyter_graph_title_and_display_label__(graph_name, graph_obj):
    metadata = getattr(graph_obj, "metadata", None)
    title = None
    display_label = None

    if metadata is not None:
        raw_title = getattr(metadata, "label", None)
        if raw_title is not None:
            try:
                title = str(raw_title).strip()
            except Exception:
                title = None
            if not title:
                title = None

        display_label = __vuepyter_parse_display_label__(getattr(metadata, "display_label", None))

    if title is None:
        title = graph_name
    if display_label is None:
        display_label = True

    return title, display_label


def __vuepyter_edge_endpoints__(raw_edge):
    for left_name, right_name in (
        ("frm", "to"),
        ("from_node", "to_node"),
        ("source", "target"),
        ("u", "v"),
        ("start", "end"),
    ):
        try:
            left = getattr(raw_edge, left_name)
            right = getattr(raw_edge, right_name)
            return left, right
        except Exception:
            pass

    try:
        left = getattr(raw_edge, "from")
        right = getattr(raw_edge, "to")
        return left, right
    except Exception:
        pass

    if isinstance(raw_edge, (list, tuple)) and len(raw_edge) >= 2:
        return raw_edge[0], raw_edge[1]

    return None, None


def __vuepyter_parse_center__(raw_center):
    if isinstance(raw_center, (list, tuple)) and len(raw_center) >= 3:
        try:
            return [float(raw_center[0]), float(raw_center[1]), float(raw_center[2])]
        except Exception:
            return [0.0, 0.0, 0.0]

    x = getattr(raw_center, "x", None)
    y = getattr(raw_center, "y", None)
    z = getattr(raw_center, "z", None)
    if x is not None and y is not None and z is not None:
        try:
            return [float(x), float(y), float(z)]
        except Exception:
            return [0.0, 0.0, 0.0]

    return [0.0, 0.0, 0.0]


def __vuepyter_camera_payload__(camera_name, camera_obj):
    center = __vuepyter_parse_center__(getattr(camera_obj, "center", [0.0, 0.0, 0.0]))
    height = float(getattr(camera_obj, "height", 480.0))
    moving = bool(getattr(camera_obj, "_moving", False))

    state_fn = getattr(camera_obj, "state", None)
    if callable(state_fn):
        try:
            state = state_fn()
        except Exception:
            state = None
        if isinstance(state, dict):
            center = __vuepyter_parse_center__(state.get("center", center))
            try:
                height = float(state.get("height", height))
            except Exception:
                pass
            moving = bool(state.get("moving", moving))

    return {
        "name": camera_name,
        "center": center,
        "height": height,
        "moving": moving,
    }


def __vuepyter_graph_to_payload__(graph_name, graph_obj):
    graph_title, graph_display_label = __vuepyter_graph_title_and_display_label__(graph_name, graph_obj)
    raw_nodes = __vuepyter_iter_items__(getattr(graph_obj, "nodes", []), limit=512)
    raw_edges = __vuepyter_iter_items__(getattr(graph_obj, "edges", []), limit=1024)

    nodes = []
    edges = []

    node_ids_by_object = {}
    node_ids_by_label = {}
    node_payloads_by_id = {}

    def ensure_node(raw, node_index=None):
        if raw is None:
            return None

        object_id = None
        label = None

        if hasattr(raw, "label"):
            try:
                object_id = id(raw)
            except Exception:
                object_id = None
            try:
                label = str(getattr(raw, "label"))
            except Exception:
                label = str(raw)
        else:
            label = str(raw)

        if object_id is not None and object_id in node_ids_by_object:
            existing = node_ids_by_object[object_id]
            if node_index is not None:
                node_payloads_by_id[existing]["node_index"] = int(node_index)
            node_payloads_by_id[existing]["uid"] = str(object_id)
            return existing

        if label in node_ids_by_label:
            existing_id = node_ids_by_label[label]
            if object_id is not None:
                node_ids_by_object[object_id] = existing_id
                node_payloads_by_id[existing_id]["uid"] = str(object_id)
            if node_index is not None:
                node_payloads_by_id[existing_id]["node_index"] = int(node_index)
            return existing_id

        color, size, display_label = __vuepyter_parse_node_metadata__(raw)
        pos = __vuepyter_parse_pos__(getattr(raw, "pos", None))

        node_id = f"n{len(nodes)}"
        node_payload = {
            "id": node_id,
            "label": label,
        }

        if object_id is not None:
            node_payload["uid"] = str(object_id)
        if node_index is not None:
            node_payload["node_index"] = int(node_index)
        if color is not None:
            node_payload["color"] = color
        if size is not None:
            node_payload["size"] = size
        if display_label is not None:
            node_payload["display_label"] = display_label
        if pos is not None:
            node_payload["pos"] = pos

        nodes.append(node_payload)
        node_payloads_by_id[node_id] = node_payload

        if object_id is not None:
            node_ids_by_object[object_id] = node_id
        node_ids_by_label[label] = node_id

        return node_id

    for raw_node_index, raw_node in enumerate(raw_nodes):
        ensure_node(raw_node, node_index=raw_node_index)

    for raw_edge in raw_edges:
        left, right = __vuepyter_edge_endpoints__(raw_edge)
        source_id = ensure_node(left, node_index=None)
        target_id = ensure_node(right, node_index=None)
        if source_id is None or target_id is None:
            continue
        edge_payload = {
            "source": source_id,
            "target": target_id,
        }

        edge_color, edge_width, edge_display_label = __vuepyter_parse_edge_metadata__(raw_edge)
        if edge_color is not None:
            edge_payload["color"] = edge_color
        if edge_width is not None:
            edge_payload["width"] = edge_width
        if edge_display_label is not None:
            edge_payload["display_label"] = edge_display_label

        edge_label = getattr(raw_edge, "label", None)
        if edge_label is not None:
            try:
                edge_label = str(edge_label)
            except Exception:
                edge_label = None
            if edge_label:
                edge_payload["label"] = edge_label

        edges.append(edge_payload)

    return {
        "name": graph_name,
        "uid": str(id(graph_obj)),
        "title": graph_title,
        "display_label": graph_display_label,
        "directed": bool(getattr(graph_obj, "directed", False)),
        "nodes": nodes,
        "edges": edges,
    }


graph_payloads = []
seen_graph_ids = set()
camera_payload = None

for global_name, global_value in list(globals().items()):
    if global_name.startswith("_"):
        continue
    if callable(global_value) or isinstance(global_value, type):
        continue

    if camera_payload is None and __vuepyter_is_camera_like__(global_value):
        camera_payload = __vuepyter_camera_payload__(global_name, global_value)

    discovered = []
    __vuepyter_walk_for_graphs__(global_value, global_name, depth=2, seen=set(), out=discovered)

    for path, graph_obj in discovered:
        graph_id = id(graph_obj)
        if graph_id in seen_graph_ids:
            continue
        seen_graph_ids.add(graph_id)
        graph_payloads.append(__vuepyter_graph_to_payload__(path, graph_obj))

payload = {
    "ok": True,
    "graphs": graph_payloads,
    "camera": camera_payload,
}

json.dumps(payload)
    `.trim()

    const app = createApp({

      setup() {
        const notebook = ref({

          '--vuepyter-bg': '#ffffff',

        )

        const pyodideRef = ref(null)
        const notebookLoaded = ref(false)
        const kernelReady = ref(false)
        const hasAutoExecutedBootstrap = ref(false)
        const autoExecutingBootstrap = ref(false)
        const viewerCanvasRef = ref(null)
        const vuepyterRef = ref(null)
        const graphGallery = ref([])
        const cameraControlledByNotebook = ref(false)
        const notebookCameraName = ref('')
        const notebookCameraZ = ref(0)
        const isPanningCamera = ref(false)
        const activeNodeDrag = ref(null)
        const hasMovedCamera = ref(false)
        const cameraScale = ref(1)
        const cameraOffsetX = ref(0)
        const cameraOffsetY = ref(0)

        let lastPointerX = 0
        let lastPointerY = 0
        let refreshInFlight = false
        let refreshQueued = false
        let refreshTimer = null
        let cameraSyncTimer = null
        let cameraSyncInFlight = false
        let cameraSyncQueued = false
        const graphRenderMemory = new Map()
        let nodePosSyncTimer = null
        let nodePosSyncInFlight = false
        let nodePosSyncQueued = false
        const pendingNodePosUpdates = new Map()
        let notebookCameraOverrideUntil = 0

        let worldBounds = {
          minX: -240,
          maxX: 240,
          minY: -160,
          maxY: 160,
        }

        function clamp(value, min, max) {
          return Math.min(max, Math.max(min, value))
        }

        function hashString(value) {
          const text = String(value)
          let hash = 2166136261
          for (let index = 0; index < text.length; index += 1) {
            hash ^= text.charCodeAt(index)
            hash +=
              (hash << 1)
              + (hash << 4)
              + (hash << 7)
              + (hash << 8)
              + (hash << 24)
          }
          return hash >>> 0
        }

        function graphStableKey(graph) {
          if (graph && typeof graph.uid === 'string' && graph.uid) {
            return `uid:${graph.uid}`
          }
          if (graph && typeof graph.name === 'string' && graph.name) {
            return `name:${graph.name}`
          }
          return ''
        }

        function calculateBounds() {
          const totalWidth = window.innerWidth - 2 * 12
          const minLeft = 280
          const minRight = 420
          const maxLeft = Math.max(minLeft, totalWidth - minRight)
          return { minLeft, maxLeft }
        }

        function calculateDefaultSplit() {
          if (window.innerWidth <= DESKTOP_BREAKPOINT) {
            return leftPaneWidth.value
          }
          const { minLeft, maxLeft } = calculateBounds()
          const totalWidth = window.innerWidth - 2 * 12
          return clamp(totalWidth / 2, minLeft, maxLeft)
        }

        function destroyPyProxy(value) {
          if (value && typeof value === 'object' && typeof value.destroy === 'function') {
            try {
              value.destroy()
            } catch {
              // Ignore proxy cleanup errors.
            }
          }
        }

        function getCanvasMetrics() {
          const canvas = viewerCanvasRef.value
          if (!canvas) {
            return null
          }
          const rect = canvas.getBoundingClientRect()
          const width = Math.max(1, rect.width)
          const height = Math.max(1, rect.height)
          const dpr = window.devicePixelRatio || 1
          const pixelWidth = Math.max(1, Math.floor(width * dpr))
          const pixelHeight = Math.max(1, Math.floor(height * dpr))
          if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
            canvas.width = pixelWidth
            canvas.height = pixelHeight
          }
          const ctx = canvas.getContext('2d')
          if (!ctx) {
            return null
          }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          return { ctx, width, height }
        }

        function normalizeGraphPayload(payload) {
          if (!payload || typeof payload !== 'object' || !Array.isArray(payload.graphs)) {
            return []
          }

          function parseNodePos(rawPos) {
            if (!Array.isArray(rawPos) || rawPos.length < 2) {
              return null
            }
            const x = Number(rawPos[0])
            const y = Number(rawPos[1])
            if (!Number.isFinite(x) || !Number.isFinite(y)) {
              return null
            }
            return [x, y]
          }

          const output = []

          for (const rawGraph of payload.graphs) {
            if (!rawGraph || typeof rawGraph !== 'object') {
              continue
            }

            const rawNodes = Array.isArray(rawGraph.nodes) ? rawGraph.nodes : []
            const rawEdges = Array.isArray(rawGraph.edges) ? rawGraph.edges : []
            const nodes = []
            const nodeIds = new Set()

            for (const rawNode of rawNodes) {
              if (!rawNode || typeof rawNode !== 'object') {
                continue
              }
              const id = rawNode.id == null ? '' : String(rawNode.id)
              if (!id || nodeIds.has(id)) {
                continue
              }
              const label = rawNode.label == null ? id : String(rawNode.label)
              const uid = rawNode.uid == null ? '' : String(rawNode.uid)
              const color = rawNode.color == null ? null : String(rawNode.color)
              const sizeNumber = Number(rawNode.size)
              const nodeIndexNumber = Number(rawNode.node_index)
              const displayLabel = typeof rawNode.display_label === 'boolean' ? rawNode.display_label : true
              const pos = parseNodePos(rawNode.pos)
              nodes.push({
                id,
                label,
                uid,
                color,
                size: Number.isFinite(sizeNumber) ? sizeNumber : null,
                nodeIndex: Number.isInteger(nodeIndexNumber) && nodeIndexNumber >= 0 ? nodeIndexNumber : null,
                displayLabel,
                pos,
                posProvided: pos !== null,
              })
              nodeIds.add(id)
            }

            const edges = []
            for (const rawEdge of rawEdges) {
              if (!rawEdge || typeof rawEdge !== 'object') {
                continue
              }
              const source = rawEdge.source == null ? '' : String(rawEdge.source)
              const target = rawEdge.target == null ? '' : String(rawEdge.target)
              if (!source || !target || !nodeIds.has(source) || !nodeIds.has(target)) {
                continue
              }
              const color = rawEdge.color == null ? null : String(rawEdge.color)
              const widthNumber = Number(rawEdge.width)
              const displayLabel = typeof rawEdge.display_label === 'boolean' ? rawEdge.display_label : false
              const label = rawEdge.label == null ? '' : String(rawEdge.label)
              edges.push({
                source,
                target,
                color,
                width: Number.isFinite(widthNumber) ? widthNumber : null,
                displayLabel,
                label,
              })
            }

            output.push({
              name: typeof rawGraph.name === 'string' && rawGraph.name ? rawGraph.name : 'graph',
              uid: rawGraph.uid == null ? '' : String(rawGraph.uid),
              title: typeof rawGraph.title === 'string' && rawGraph.title
                ? rawGraph.title
                : (typeof rawGraph.name === 'string' && rawGraph.name ? rawGraph.name : 'graph'),
              displayLabel: typeof rawGraph.display_label === 'boolean' ? rawGraph.display_label : true,
              directed: !!rawGraph.directed,
              nodes,
              edges,
            })
          }

          output.sort((a, b) => a.name.localeCompare(b.name))
          return output
        }

        function nodeRadius(node) {
          if (Number.isFinite(node.size)) {
            return clamp(8 + node.size * 1.2, 9, 24)
          }
          return 14
        }

        function resolveColor(rawColor, fallback) {
          if (typeof rawColor !== 'string' || !rawColor.trim()) {
            return fallback
          }
          const candidate = rawColor.trim()

          if (typeof CSS !== 'undefined' && typeof CSS.supports === 'function' && CSS.supports('color', candidate)) {
            return candidate
          }

          const named = {
            green: '#10b981',
            teal: '#14b8a6',
            cyan: '#22d3ee',
            yellow: '#e9c84b',
            amber: '#f59e0b',
            orange: '#fb923c',
            red: '#ef4444',
            blue: '#3b82f6',
            purple: '#a855f7',
            pink: '#ec4899',
            white: '#f8fafc',
            gray: '#94a3b8',
            grey: '#94a3b8',
          }
          const key = candidate.toLowerCase()
          return named[key] || fallback
        }

        function nodeColor(node) {
          return resolveColor(node.color, '#10b981')
        }

        function edgeColor(edge) {
          return resolveColor(edge.color, 'rgba(250, 250, 252, 0.95)')
        }

        function edgeStrokeWidth(edge) {
          if (Number.isFinite(edge.width)) {
            return clamp(1.4 + edge.width * 0.44, 1.2, 18)
          }
          return 5.8
        }

        function layoutSingleGraph(graph) {
          const nodes = graph.nodes
          const edges = graph.edges
          const total = nodes.length

          if (total === 0) {
            return {
              nodes: [],
              edges: [],
              bounds: {
                minX: -120,
                maxX: 120,
                minY: -80,
                maxY: 80,
              },
            }
          }

          const positions = nodes.map((node, index) => {

          }

          for (const pending of pendingNodePosUpdates.values()) {
            if (!pending || typeof pending !== 'object') {
              continue
            }
            const graphUid = typeof pending.graph_uid === 'string' ? pending.graph_uid : ''
            const graphName = typeof pending.graph === 'string' ? pending.graph : ''
            if (!graphUid && !graphName) {
              continue
            }
            const pos = Array.isArray(pending.pos) ? pending.pos : null
            if (!pos || pos.length < 2) {
              continue
            }
            const px = Number(pos[0])
            const py = Number(pos[1])
            if (!Number.isFinite(px) || !Number.isFinite(py)) {
              continue
            }

            const graph = graphs.find((candidate) => (
              (graphUid && candidate?.uid === graphUid)
              || (graphName && candidate?.name === graphName)
            ))
            if (!graph || !Array.isArray(graph.nodes)) {
              continue
            }

            const pendingNodeIndex = Number(pending.node_index)
            const pendingNodeUid = pending.node_uid == null ? '' : String(pending.node_uid)
            const pendingNodeId = pending.node_id == null ? '' : String(pending.node_id)
            const pendingNodeLabel = pending.node_label == null ? '' : String(pending.node_label)

            let node = null
            if (pendingNodeUid) {
              node = graph.nodes.find((candidate) => candidate?.uid === pendingNodeUid) || null
            }
            if (Number.isInteger(pendingNodeIndex)
              && pendingNodeIndex >= 0
              && pendingNodeIndex < graph.nodes.length) {
              if (!node) {
                node = graph.nodes[pendingNodeIndex]
              }
            }
            if (!node && pendingNodeId) {
              node = graph.nodes.find((candidate) => candidate?.id === pendingNodeId)
            }
            if (!node && pendingNodeLabel) {
              node = graph.nodes.find((candidate) => String(candidate?.label ?? '') === pendingNodeLabel)
            }
            if (!node) {
              continue
            }

            node.pos = [px, py]
            node.posProvided = true
          }
        }

        function queueInitialNodePositionSync() {
          const graphs = graphGallery.value
          if (!Array.isArray(graphs) || graphs.length === 0) {
            return
          }

          for (const graph of graphs) {
            const renderNodes = Array.isArray(graph?.render?.nodes) ? graph.render.nodes : []
            if (renderNodes.length === 0) {
              continue
            }

            const modelNodes = Array.isArray(graph.nodes) ? graph.nodes : []

            for (const node of renderNodes) {
              if (!node || node.posProvided === true) {
                continue
              }
              if (!Number.isFinite(node.localX) || !Number.isFinite(node.localY)) {
                continue
              }

              let modelNode = null
              if (typeof node.uid === 'string' && node.uid) {
                modelNode = modelNodes.find((candidate) => candidate?.uid === node.uid) || null
              }
              if (!modelNode && Number.isInteger(node.nodeIndex)
                && node.nodeIndex >= 0
                && node.nodeIndex < modelNodes.length
                && modelNodes[node.nodeIndex]?.id === node.id) {
                modelNode = modelNodes[node.nodeIndex]
              }
              if (!modelNode) {
                modelNode = modelNodes.find((candidate) => candidate?.id === node.id)
              }
              if (!modelNode && typeof node.label === 'string' && node.label) {
                modelNode = modelNodes.find((candidate) => String(candidate?.label ?? '') === node.label)
              }
              if (!modelNode) {
                continue
              }

              const pos = [node.localX, node.localY]
              modelNode.pos = pos
              modelNode.posProvided = true
              node.posProvided = true

              queueNodePosSync({
                graphUid: graph.uid,
                graphName: graph.name,
                nodeUid: node.uid,
                nodeId: node.id,
                nodeIndex: node.nodeIndex,
                nodeLabel: node.label,
                pos,
              }, 0)
            }
          }
        }

        function drawArrowhead(ctx, source, target, size) {
          const dx = target.x - source.x
          const dy = target.y - source.y
          const dist = Math.hypot(dx, dy)
          if (dist < 1) {
            return
          }

          const ux = dx / dist
          const uy = dy / dist
          const tipX = target.x - ux * (target.radius + 2)
          const tipY = target.y - uy * (target.radius + 2)
          const wingX = -uy
          const wingY = ux

          ctx.beginPath()
          ctx.moveTo(tipX, tipY)
          ctx.lineTo(tipX - ux * size + wingX * size * 0.58, tipY - uy * size + wingY * size * 0.58)
          ctx.lineTo(tipX - ux * size - wingX * size * 0.58, tipY - uy * size - wingY * size * 0.58)
          ctx.closePath()
          ctx.fill()
        }

        function drawGallery() {
          const metrics = getCanvasMetrics()
          if (!metrics) {
            return
          }

          const { ctx, width, height } = metrics

          ctx.clearRect(0, 0, width, height)

          ctx.fillStyle = '#271828'
          ctx.fillRect(0, 0, width, height)

          const graphs = graphGallery.value
          if (!Array.isArray(graphs) || graphs.length === 0) {
            return
          }

          ctx.save()
          ctx.translate(cameraOffsetX.value, cameraOffsetY.value)
          ctx.scale(cameraScale.value, cameraScale.value)

          ctx.lineCap = 'round'
          ctx.lineJoin = 'round'

          for (const graph of graphs) {
            if (!graph.render) {
              continue
            }

            for (const edge of graph.render.edges) {
              ctx.strokeStyle = edge.color
              ctx.lineWidth = edge.width / cameraScale.value
              ctx.beginPath()
              ctx.moveTo(edge.source.x, edge.source.y)
              ctx.lineTo(edge.target.x, edge.target.y)
              ctx.stroke()
            }

            if (graph.render.directed) {
              for (const edge of graph.render.edges) {
                ctx.fillStyle = edge.color
                drawArrowhead(ctx, edge.source, edge.target, 13 / cameraScale.value)
              }
            }

            for (const edge of graph.render.edges) {
              if (!edge.displayLabel) {
                continue
              }
              const dx = edge.target.x - edge.source.x
              const dy = edge.target.y - edge.source.y
              const dist = Math.hypot(dx, dy) || 1
              const nx = -dy / dist
              const ny = dx / dist
              const midX = (edge.source.x + edge.target.x) / 2 + nx * (14 / cameraScale.value)
              const midY = (edge.source.y + edge.target.y) / 2 + ny * (14 / cameraScale.value)

              ctx.fillStyle = edge.color
              ctx.textAlign = 'center'
              ctx.textBaseline = 'middle'
              ctx.font = `italic ${20 / cameraScale.value}px "Times New Roman", Georgia, serif`
              ctx.fillText(edge.label, midX, midY)
            }

            for (const node of graph.render.nodes) {
              ctx.save()
              ctx.shadowColor = `${node.color}99`
              ctx.shadowBlur = 18 / cameraScale.value
              ctx.fillStyle = node.color
              ctx.beginPath()
              ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2)
              ctx.fill()
              ctx.restore()
            }

            ctx.fillStyle = 'rgba(250, 250, 252, 0.98)'
            ctx.textAlign = 'left'
            ctx.textBaseline = 'middle'
            ctx.font = `italic ${34 / cameraScale.value}px "Times New Roman", Georgia, serif`
            for (const node of graph.render.nodes) {
              if (!node.displayLabel) {
                continue
              }
              ctx.fillText(node.label, node.x + node.radius + 8, node.y - node.radius * 0.95)
            }

            ctx.fillStyle = 'rgba(238, 241, 246, 0.9)'
            if (graph.render.displayLabel) {
              ctx.textAlign = 'center'
              ctx.textBaseline = 'middle'
              ctx.font = `italic ${26 / cameraScale.value}px "Times New Roman", Georgia, serif`
              ctx.fillText(graph.render.title, graph.render.titleX, graph.render.titleY)
            }
          }

          ctx.restore()
        }

        function applySnapshot(payload) {
          const previousRenderByGraphName = new Map(graphRenderMemory)
          for (const graph of graphGallery.value) {
            if (graph && graph.render && typeof graph.name === 'string' && graph.name) {
              previousRenderByGraphName.set(graphStableKey(graph), graph.render)
            }
          }

          const previousCount = graphGallery.value.length
          graphGallery.value = normalizeGraphPayload(payload)
          applyPendingNodePosToGraphs(graphGallery.value)
          rebuildWorldLayout(previousRenderByGraphName)

          if (activeNodeDrag.value
            && Number.isFinite(activeNodeDrag.value.worldX)
            && Number.isFinite(activeNodeDrag.value.worldY)) {
            updateNodePositionInRender(activeNodeDrag.value)
          }

          queueInitialNodePositionSync()

          if (previousCount === 0 && graphGallery.value.length > 0) {
            hasMovedCamera.value = false
          }

          const hadNotebookCamera = cameraControlledByNotebook.value
          const notebookCamera = parseNotebookCamera(payload)
          cameraControlledByNotebook.value = notebookCamera !== null

          if (notebookCamera) {
            notebookCameraName.value = notebookCamera.name
            notebookCameraZ.value = notebookCamera.center[2]
            const shouldApplyNotebookCamera =
              Date.now() >= notebookCameraOverrideUntil
              && !isPanningCamera.value
              && !activeNodeDrag.value

            if (shouldApplyNotebookCamera) {
              applyNotebookCamera(notebookCamera)
            }
            if (notebookCamera.moving) {
              queueGraphRefresh(16)
            }
          } else {
            notebookCameraName.value = ''
            // Avoid viewport jumps when camera is temporarily unavailable during kernel transitions.
            if (!hadNotebookCamera) {
              fitCameraToWorld(false)
            }
          }

          drawGallery()
        }

        async function refreshGraphs() {
          const instance = pyodideRef.value
          if (!instance || typeof instance.runPythonAsync !== 'function') {
            applySnapshot({ graphs: [] })
            return
          }

          if (refreshInFlight) {
            refreshQueued = true
            return
          }

          refreshInFlight = true
          let rawResult = null

          try {
            rawResult = await instance.runPythonAsync(GRAPH_SNAPSHOT_SOURCE)
            const text = typeof rawResult === 'string' ? rawResult : String(rawResult)
            const payload = JSON.parse(text)
            applySnapshot(payload)
          } catch (error) {
            console.error(error)
          } finally {
            destroyPyProxy(rawResult)
            refreshInFlight = false
            if (refreshQueued) {
              refreshQueued = false
              void refreshGraphs()
            }
          }
        }

        function queueGraphRefresh(delayMs = 0) {
          if (refreshTimer !== null) {
            return
          }
          refreshTimer = window.setTimeout(() => {
            refreshTimer = null
            void refreshGraphs()
          }, delayMs)
        }

        function onPointerMove(event) {
          if (!resizing.value || window.innerWidth <= DESKTOP_BREAKPOINT) {
            return
          }

          const { minLeft, maxLeft } = calculateBounds()
          leftPaneWidth.value = clamp(event.clientX - 12, minLeft, maxLeft)
          drawGallery()
        }

        function stopResize() {
          resizing.value = false
          document.body.classList.remove('is-resizing')
          window.removeEventListener('pointermove', onPointerMove)
          window.removeEventListener('pointerup', stopResize)
        }

        function startResize(event) {
          if (window.innerWidth <= DESKTOP_BREAKPOINT) {
            return
          }
          event.preventDefault()
          resizing.value = true
          document.body.classList.add('is-resizing')
          window.addEventListener('pointermove', onPointerMove)
          window.addEventListener('pointerup', stopResize)
        }

        function resetSplit() {
          leftPaneWidth.value = calculateDefaultSplit()
          drawGallery()
        }

        function onWindowResize() {
          if (window.innerWidth > DESKTOP_BREAKPOINT) {
            const { minLeft, maxLeft } = calculateBounds()
            leftPaneWidth.value = clamp(leftPaneWidth.value, minLeft, maxLeft)
          }
          if (cameraControlledByNotebook.value) {
            queueGraphRefresh()
            drawGallery()
            return
          }
          fitCameraToWorld(false)
          drawGallery()
        }

        async function loadNotebook() {
          try {
            const response = await fetch(NOTEBOOK_URL, { cache: 'no-store' })
            if (!response.ok) {
              throw new Error(`Failed to load ${NOTEBOOK_URL}: ${response.status}`)
            }
            const data = await response.json()
            if (!data || typeof data !== 'object' || !Array.isArray(data.cells)) {
              throw new Error('Invalid notebook format')
            }
            notebook.value = data
            notebookLoaded.value = true
            void maybeAutoExecuteBootstrapCells()
          } catch (error) {
            console.error(error)
          }
        }

        function getCellSource(cell) {
          if (!cell || typeof cell !== 'object') {
            return ''
          }
          const source = cell.source
          if (Array.isArray(source)) {
            return source.join('')
          }
          if (typeof source === 'string') {
            return source
          }
          return ''
        }

        function getBootstrapCodeCellIndices(limit = 2) {
          const cells = Array.isArray(notebook.value?.cells) ? notebook.value.cells : []
          const indices = []
          for (const [index, cell] of cells.entries()) {
            if (cell && cell.cell_type === 'code') {
              indices.push(index)
            }
            if (indices.length >= limit) {
              break
            }
          }
          return indices
        }

        async function runCodeCellInVuepyter(index) {
          await nextTick()
          const editor = vuepyterRef.value
          if (!editor || typeof editor !== 'object') {
            return false
          }

          if (typeof editor.executeCell === 'function') {
            await editor.executeCell(index)
            return true
          }

          const internalExecuteCell = editor?.$?.setupState?.executeCell
          if (typeof internalExecuteCell === 'function') {
            await internalExecuteCell(index)
            return true
          }

          return false
        }

        async function executeBootstrapCellsInVuepyter(indices) {
          if (!Array.isArray(indices) || indices.length === 0) {
            return true
          }
          for (const cellIndex of indices) {
            const executed = await runCodeCellInVuepyter(cellIndex)
            if (!executed) {
              return false
            }
          }
          return true
        }

        async function maybeAutoExecuteBootstrapCells() {
          if (hasAutoExecutedBootstrap.value || autoExecutingBootstrap.value) {
            return
          }
          if (!kernelReady.value || !notebookLoaded.value) {
            return
          }

          const bootstrapCellIndices = getBootstrapCodeCellIndices(2)

          if (bootstrapCellIndices.length === 0) {
            hasAutoExecutedBootstrap.value = true
            return
          }

          autoExecutingBootstrap.value = true
          try {
            const executedInVuepyter = await executeBootstrapCellsInVuepyter(bootstrapCellIndices)
            if (!executedInVuepyter) {
              const instance = pyodideRef.value
              if (!instance || typeof instance.runPythonAsync !== 'function') {
                return
              }
              for (const cellIndex of bootstrapCellIndices) {
                const source = getCellSource(notebook.value?.cells?.[cellIndex])
                if (!source.trim()) {
                  continue
                }
                await instance.runPythonAsync(source)
              }
            }
          } catch (error) {
            console.error('Auto execute bootstrap cells failed', error)
          } finally {
            autoExecutingBootstrap.value = false
            hasAutoExecutedBootstrap.value = true
            queueGraphRefresh()
          }
        }

        function onCanvasPointerDown(event) {
          if (event.button !== 0) {
            return
          }

          const world = pointerWorldPosition(event)
          if (world) {
            const hit = findNodeAtWorldPosition(world.x, world.y)
            if (hit && hit.graph?.render) {
              activeNodeDrag.value = {
                pointerId: event.pointerId,
                graphUid: hit.graph.uid,
                graphName: hit.graph.name,
                nodeUid: hit.node.uid,
                nodeId: hit.node.id,
                nodeIndex: Number.isInteger(hit.node.nodeIndex) ? hit.node.nodeIndex : null,
                nodeLabel: hit.node.label,
                grabDX: world.x - hit.node.x,
                grabDY: world.y - hit.node.y,
                worldX: hit.node.x,
                worldY: hit.node.y,
              }
              isPanningCamera.value = false
              if (event.currentTarget && typeof event.currentTarget.setPointerCapture === 'function') {
                event.currentTarget.setPointerCapture(event.pointerId)
              }
              return
            }
          }

          activeNodeDrag.value = null
          isPanningCamera.value = true
          lastPointerX = event.clientX
          lastPointerY = event.clientY
          if (event.currentTarget && typeof event.currentTarget.setPointerCapture === 'function') {
            event.currentTarget.setPointerCapture(event.pointerId)
          }
        }

        function onCanvasPointerMove(event) {
          if (activeNodeDrag.value) {
            if (activeNodeDrag.value.pointerId !== event.pointerId) {
              return
            }
            const world = pointerWorldPosition(event)
            if (!world) {
              return
            }

            const drag = activeNodeDrag.value
            drag.worldX = world.x - drag.grabDX
            drag.worldY = world.y - drag.grabDY

            const updated = updateNodePositionInRender(drag)
            if (updated) {
              queueNodePosSync(updated, 22)
            }

            drawGallery()
            return
          }

          if (!isPanningCamera.value) {
            return
          }
          const dx = event.clientX - lastPointerX
          const dy = event.clientY - lastPointerY
          lastPointerX = event.clientX
          lastPointerY = event.clientY
          cameraOffsetX.value += dx
          cameraOffsetY.value += dy
          hasMovedCamera.value = true
          notebookCameraOverrideUntil = Date.now() + 140
          drawGallery()
          queueNotebookCameraSync(32)
        }

        function onCanvasPointerUp(event) {
          if (activeNodeDrag.value) {
            if (activeNodeDrag.value.pointerId !== event.pointerId) {
              return
            }
            const drag = activeNodeDrag.value
            activeNodeDrag.value = null

            const updated = updateNodePositionInRender(drag)
            if (updated) {
              queueNodePosSync(updated, 0)
            }

            if (event.currentTarget && typeof event.currentTarget.releasePointerCapture === 'function') {
              try {
                event.currentTarget.releasePointerCapture(event.pointerId)
              } catch {
                // Ignore release errors when pointer capture has already ended.
              }
            }
            return
          }

          if (!isPanningCamera.value) {
            return
          }
          isPanningCamera.value = false
          if (event.currentTarget && typeof event.currentTarget.releasePointerCapture === 'function') {
            try {
              event.currentTarget.releasePointerCapture(event.pointerId)
            } catch {
              // Ignore release errors when pointer capture has already ended.
            }
          }
          notebookCameraOverrideUntil = Date.now() + 140
          queueNotebookCameraSync()
        }

        function onCanvasWheel(event) {
          const canvas = viewerCanvasRef.value
          if (!canvas) {
            return
          }

          const rect = canvas.getBoundingClientRect()
          const localX = event.clientX - rect.left
          const localY = event.clientY - rect.top
          const worldX = (localX - cameraOffsetX.value) / cameraScale.value
          const worldY = (localY - cameraOffsetY.value) / cameraScale.value

          const factor = Math.exp(-event.deltaY * 0.0012)
          const nextScale = clamp(cameraScale.value * factor, 0.1, 5)
          if (nextScale === cameraScale.value) {
            return
          }

          cameraScale.value = nextScale
          cameraOffsetX.value = localX - worldX * nextScale
          cameraOffsetY.value = localY - worldY * nextScale
          hasMovedCamera.value = true
          notebookCameraOverrideUntil = Date.now() + 140
          drawGallery()
          queueNotebookCameraSync(32)
        }

        function resetGraphCamera() {
          if (cameraControlledByNotebook.value) {
            queueGraphRefresh()
            return
          }
          hasMovedCamera.value = false
          fitCameraToWorld(true)
          drawGallery()
        }

        function onKernelReady(payload) {
          pyodideRef.value = payload?.pyodide ?? null
          kernelReady.value = true
          void maybeAutoExecuteBootstrapCells()
          queueGraphRefresh()
        }

        function onCellComplete() {
          queueGraphRefresh()
        }

        function onWorkspaceSync(payload) {
          if (payload && payload.mode === 'always-live') {
            queueGraphRefresh(80)
          }
        }

        const pageStyle = computed(() => ({
          '--left-pane-width': `${leftPaneWidth.value}px`,
        }))

        onMounted(() => {
          if (window.innerWidth > DESKTOP_BREAKPOINT) {
            leftPaneWidth.value = calculateDefaultSplit()
          }
          window.addEventListener('resize', onWindowResize)
          void loadNotebook()
          resetGraphCamera()
        })

        onBeforeUnmount(() => {
          stopResize()
          window.removeEventListener('resize', onWindowResize)
          if (refreshTimer !== null) {
            clearTimeout(refreshTimer)
            refreshTimer = null
          }
          if (cameraSyncTimer !== null) {
            clearTimeout(cameraSyncTimer)
            cameraSyncTimer = null
          }
          if (nodePosSyncTimer !== null) {
            clearTimeout(nodePosSyncTimer)
            nodePosSyncTimer = null
          }
        })

        return {
          notebook,
          editorTheme,
          pageStyle,
          startResize,
          resetSplit,
          viewerCanvasRef,
          vuepyterRef,
          isPanningCamera,
          onCanvasPointerDown,
          onCanvasPointerMove,
          onCanvasPointerUp,
          onCanvasWheel,
          resetGraphCamera,
          onKernelReady,
          onCellComplete,
          onWorkspaceSync,
        }
      },
      template: `
          <main class="page" :style="pageStyle">
            <section class="left-pane">
              <section class="left-pane-card" aria-label="Graph visualizer">
                <canvas
                  ref="viewerCanvasRef"
                  class="graph-canvas"
                  :class="{ 'is-panning': isPanningCamera }"
                  @wheel.prevent="onCanvasWheel"
                  @pointerdown="onCanvasPointerDown"
                  @pointermove="onCanvasPointerMove"
                  @pointerup="onCanvasPointerUp"
                  @pointercancel="onCanvasPointerUp"
                  @pointerleave="onCanvasPointerUp"
                  @dblclick="resetGraphCamera"
                />
              </section>
            </section>

            <div
              class="splitter"
              role="separator"
              aria-label="Resize panes"
              aria-orientation="vertical"
              @pointerdown="startResize"
              @dblclick="resetSplit"
            />

            <section class="right-pane">
              <Vuepyter
                ref="vuepyterRef"
                class="editor-fill"
                v-model="notebook"
                :autosave-interval="1000"
                :theme="editorTheme"
                @ready="onKernelReady"
                @workspace:sync="onWorkspaceSync"
                @cell:complete="onCellComplete"
              />
            </section>
          </main>
        `,
    })

    app.mount('#app')
  </script>
</body>

</html>
