      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;

      top: 0;
      transform: translate(-50%, -50%);
      transform-origin: center center;

      line-height: 1;

import json
import math

# Snapshot contract:
# - Discover graph/camera/canvas objects from globals.
# - Normalize to JSON-safe payload consumed by normalizeGraphPayload().
# - Preserve stable identity fields so drag and animation patches can round-trip.
# - Carry graph layout and edge path style/spec metadata so JS can render non-linear layouts/paths.


def __vuepyter_finite_float__(value, default=None):
    try:
        numeric = float(value)
    except Exception:
        return default
    if not math.isfinite(numeric):
        return default
    return numeric


def __vuepyter_is_graph_like__(value):
    if value is None or isinstance(value, type):
        return False
    try:
        nodes = getattr(value, "nodes")
        edges = getattr(value, "edges")
    except Exception:
        return False

    try:
        iter(nodes)
        iter(edges)
    except Exception:
        return False

    return True


def __vuepyter_is_camera_like__(value):
    if value is None or isinstance(value, type):
        return False
    if not callable(getattr(value, "move_to", None)):
        return False
    try:
        center = getattr(value, "center")
        height = getattr(value, "height")
    except Exception:
        return False
    if center is None:
        return False
    if __vuepyter_finite_float__(height, default=None) is None:
        return False
    return True


def __vuepyter_is_canvas_like__(value):
    if value is None or isinstance(value, type):
        return False
    try:
        getattr(value, "background_color")
    except Exception:
        return False
    return True


def __vuepyter_iter_items__(value, limit=512):
    if value is None:
        return []

    if isinstance(value, dict):
        source = value.values()
    elif isinstance(value, (list, tuple, set, frozenset)):
        source = value
    else:
        try:
            source = value
            iter(source)
        except Exception:
            return []

    out = []
    for index, item in enumerate(source):
        if index >= limit:
            break
        out.append(item)
    return out


def __vuepyter_path_append_key__(path, key):
    encoded = repr(key)
    if path:
        return f"{path}[{encoded}]"
    return f"[{encoded}]"


def __vuepyter_walk_for_graphs__(value, path, depth, seen, out):
    if depth < 0:
        return

    key = id(value)
    if key in seen:
        return
    seen.add(key)

    if __vuepyter_is_graph_like__(value):
        out.append((path, value))
        return

    if isinstance(value, dict):
        for index, (item_key, item_value) in enumerate(list(value.items())[:64]):
            child_path = __vuepyter_path_append_key__(path, item_key)
            __vuepyter_walk_for_graphs__(item_value, child_path, depth - 1, seen, out)
            if index >= 63:
                break
        return

    if isinstance(value, (list, tuple, set, frozenset)):
        for index, item in enumerate(list(value)[:64]):
            child_path = f"{path}[{index}]"
            __vuepyter_walk_for_graphs__(item, child_path, depth - 1, seen, out)
        return

    try:
        attr_items = list(vars(value).items())[:64]
    except Exception:
        attr_items = []

    for attr_name, attr_value in attr_items:
        if not isinstance(attr_name, str) or not attr_name or not attr_name.isidentifier():
            continue
        child_path = f"{path}.{attr_name}" if path else attr_name
        __vuepyter_walk_for_graphs__(attr_value, child_path, depth - 1, seen, out)

def __vuepyter_parse_display_label__(raw):
    if raw is None:
        return None
    if isinstance(raw, bool):
        return raw
    if isinstance(raw, (int, float)):
        return bool(raw)
    if isinstance(raw, str):
        lowered = raw.strip().lower()
        if lowered in ("true", "1", "yes", "y", "on"):
            return True
        if lowered in ("false", "0", "no", "n", "off"):
            return False
    return None


def __vuepyter_parse_color__(raw_color):
    if raw_color is None:
        return None
    try:
        color = str(raw_color).strip()
    except Exception:
        return None
    if not color:
        return None
    return color


def __vuepyter_parse_path_style__(raw_style):
    if raw_style is None:
        return None
    try:
        path_style = str(raw_style).strip().lower()
    except Exception:
        return None
    if not path_style:
        return None
    return path_style


def __vuepyter_json_safe__(value, depth=4, item_limit=48):
    if depth < 0:
        return None

    if value is None:
        return None
    if isinstance(value, bool):
        return value
    if isinstance(value, str):
        return value
    if isinstance(value, int):
        return int(value)
    if isinstance(value, float):
        numeric = __vuepyter_finite_float__(value, default=None)
        return numeric

    if isinstance(value, (list, tuple)):
        items = []
        for index, item in enumerate(value):
            if index >= item_limit:
                break
            items.append(__vuepyter_json_safe__(item, depth=depth - 1, item_limit=item_limit))
        return items

    if isinstance(value, dict):
        output = {}
        for index, (raw_key, raw_item) in enumerate(value.items()):
            if index >= item_limit:
                break
            try:
                key = str(raw_key)
            except Exception:
                continue
            if not key:
                continue
            output[key] = __vuepyter_json_safe__(raw_item, depth=depth - 1, item_limit=item_limit)
        return output

    return None


def __vuepyter_parse_path_spec__(raw_spec):
    parsed = __vuepyter_json_safe__(raw_spec, depth=4, item_limit=48)
    if isinstance(parsed, (dict, list)):
        return parsed
    return None


def __vuepyter_object_field__(source, field_name):
    if source is None or not field_name:
        return None

    if isinstance(source, dict):
        if field_name in source:
            return source.get(field_name)
        return None

    try:
        return getattr(source, field_name)
    except Exception:
        return None


def __vuepyter_parse_layout_mode__(raw_mode):
    if raw_mode is None:
        return None
    try:
        mode = str(raw_mode).strip().lower()
    except Exception:
        return None
    if not mode:
        return None
    return mode


def __vuepyter_parse_graph_layout__(graph_obj):
    metadata = getattr(graph_obj, "metadata", None)
    raw_layout = None
    for source in (metadata, graph_obj):
        candidate = __vuepyter_object_field__(source, "layout")
        if candidate is not None and not callable(candidate):
            raw_layout = candidate
            break

    layout_mode = None
    for source in (metadata, graph_obj):
        for mode_key in ("layout_mode", "layoutMode", "layout_type", "layoutType"):
            candidate_mode_raw = __vuepyter_object_field__(source, mode_key)
            if callable(candidate_mode_raw):
                continue
            candidate_mode = __vuepyter_parse_layout_mode__(candidate_mode_raw)
            if candidate_mode is not None:
                layout_mode = candidate_mode
                break
        if layout_mode is not None:
            break

    parsed_layout = __vuepyter_json_safe__(raw_layout, depth=4, item_limit=48)
    if isinstance(parsed_layout, str):
        parsed_mode = __vuepyter_parse_layout_mode__(parsed_layout)
        parsed_layout = {"mode": parsed_mode} if parsed_mode is not None else None
    elif isinstance(parsed_layout, list):
        parsed_layout = {"params": parsed_layout}
    elif isinstance(parsed_layout, dict):
        parsed_mode = __vuepyter_parse_layout_mode__(parsed_layout.get("mode"))
        if parsed_mode is None:
            parsed_mode = __vuepyter_parse_layout_mode__(parsed_layout.get("layout_mode"))
        if parsed_mode is None:
            parsed_mode = __vuepyter_parse_layout_mode__(parsed_layout.get("layoutMode"))
        if parsed_mode is not None:
            parsed_layout["mode"] = parsed_mode
    elif parsed_layout is not None:
        parsed_layout = None

    if layout_mode is not None:
        if isinstance(parsed_layout, dict):
            if "mode" not in parsed_layout:
                parsed_layout["mode"] = layout_mode
        else:
            parsed_layout = {"mode": layout_mode}

    if isinstance(parsed_layout, dict):
        return parsed_layout
    return None


def __vuepyter_parse_node_metadata__(raw):
    metadata = getattr(raw, "metadata", None)
    fill_color = __vuepyter_parse_color__(getattr(metadata, "fill_color", None))
    stroke_color = __vuepyter_parse_color__(getattr(metadata, "stroke_color", None))
    stroke_width = __vuepyter_finite_float__(getattr(metadata, "stroke_width", None), default=None)
    diameter = __vuepyter_finite_float__(getattr(metadata, "diameter", None), default=None)
    label_size = __vuepyter_finite_float__(getattr(metadata, "label_size", None), default=None)
    label_color = __vuepyter_parse_color__(getattr(metadata, "label_color", None))
    display_label = __vuepyter_parse_display_label__(getattr(metadata, "display_label", None))

    if stroke_width is not None and stroke_width < 0:
        stroke_width = None

    if diameter is not None and diameter < 0:
        diameter = None

    if label_size is not None and label_size < 0:
        label_size = None

    return fill_color, stroke_color, stroke_width, diameter, label_size, label_color, display_label


def __vuepyter_parse_edge_metadata__(raw):
    metadata = getattr(raw, "metadata", None)
    color = __vuepyter_parse_color__(getattr(metadata, "color", None))
    width = getattr(metadata, "width", None)
    display_label = __vuepyter_parse_display_label__(getattr(metadata, "display_label", None))
    path_style = None
    path_spec = None

    if metadata is not None:
        path_style = __vuepyter_parse_path_style__(getattr(metadata, "path_style", None))
        if path_style is None:
            path_style = __vuepyter_parse_path_style__(getattr(metadata, "pathStyle", None))
        path_spec = __vuepyter_parse_path_spec__(getattr(metadata, "path_spec", None))
        if path_spec is None:
            path_spec = __vuepyter_parse_path_spec__(getattr(metadata, "pathSpec", None))

    if path_style is None:
        path_style = __vuepyter_parse_path_style__(getattr(raw, "path_style", None))
    if path_style is None:
        path_style = __vuepyter_parse_path_style__(getattr(raw, "pathStyle", None))
    if path_spec is None:
        path_spec = __vuepyter_parse_path_spec__(getattr(raw, "path_spec", None))
    if path_spec is None:
        path_spec = __vuepyter_parse_path_spec__(getattr(raw, "pathSpec", None))

    resolve_path_spec = getattr(raw, "resolve_path_spec", None)
    if callable(resolve_path_spec):
        try:
            resolved_path_spec = __vuepyter_parse_path_spec__(resolve_path_spec())
        except Exception:
            resolved_path_spec = None
        if resolved_path_spec is not None:
            path_spec = resolved_path_spec
            if path_style is None and isinstance(resolved_path_spec, dict):
                path_style = __vuepyter_parse_path_style__(resolved_path_spec.get("style"))

    if width is not None:
        width = __vuepyter_finite_float__(width, default=None)
        if width is not None and width < 0:
            width = None

    return color, width, display_label, path_style, path_spec


def __vuepyter_parse_pos__(raw_pos):
    if raw_pos is None:
        return None

    if isinstance(raw_pos, (list, tuple)) and len(raw_pos) >= 2:
        x = __vuepyter_finite_float__(raw_pos[0], default=None)
        y = __vuepyter_finite_float__(raw_pos[1], default=None)
        if x is not None and y is not None:
            return [x, y]
        return None

    if isinstance(raw_pos, dict):
        x = raw_pos.get("x")
        y = raw_pos.get("y")
        if x is not None and y is not None:
            px = __vuepyter_finite_float__(x, default=None)
            py = __vuepyter_finite_float__(y, default=None)
            if px is not None and py is not None:
                return [px, py]
            return None

    x = getattr(raw_pos, "x", None)
    y = getattr(raw_pos, "y", None)
    if x is not None and y is not None:
        px = __vuepyter_finite_float__(x, default=None)
        py = __vuepyter_finite_float__(y, default=None)
        if px is not None and py is not None:
            return [px, py]
        return None

    return None

    metadata = getattr(graph_obj, "metadata", None)

    if metadata is not None:
        raw_title = getattr(metadata, "label", None)
        if raw_title is not None:

                title = None
            if not title:
                title = None

        display_label = __vuepyter_parse_display_label__(getattr(metadata, "display_label", None))

    if title is None:
        title = graph_name
    if display_label is None:
        display_label = True

    return title, display_label


def __vuepyter_edge_endpoints__(raw_edge):
    for left_name, right_name in (
        ("frm", "to"),
        ("from_node", "to_node"),
        ("source", "target"),
        ("u", "v"),
        ("start", "end"),
    ):
        try:
            left = getattr(raw_edge, left_name)
            right = getattr(raw_edge, right_name)
            return left, right
        except Exception:
            pass

    try:
        left = getattr(raw_edge, "from")
        right = getattr(raw_edge, "to")
        return left, right
    except Exception:
        pass

    if isinstance(raw_edge, (list, tuple)) and len(raw_edge) >= 2:
        return raw_edge[0], raw_edge[1]

    return None, None


def __vuepyter_parse_center__(raw_center):
    if isinstance(raw_center, (list, tuple)) and len(raw_center) >= 2:
        cx = __vuepyter_finite_float__(raw_center[0], default=None)
        cy = __vuepyter_finite_float__(raw_center[1], default=None)
        cz = __vuepyter_finite_float__(raw_center[2] if len(raw_center) > 2 else 0.0, default=None)
        if cx is not None and cy is not None and cz is not None:
            return [cx, cy, cz]
        return None

    x = getattr(raw_center, "x", None)
    y = getattr(raw_center, "y", None)
    if x is not None and y is not None:
        z = getattr(raw_center, "z", 0.0)
        cx = __vuepyter_finite_float__(x, default=None)
        cy = __vuepyter_finite_float__(y, default=None)
        cz = __vuepyter_finite_float__(z, default=None)
        if cx is not None and cy is not None and cz is not None:
            return [cx, cy, cz]
        return None

    return None


def __vuepyter_camera_payload__(camera_name, camera_obj):
    center = __vuepyter_parse_center__(getattr(camera_obj, "center", [0.0, 0.0, 0.0]))

            edgeSizing.arrowMin,
            edgeSizing.arrowMax,

            edgeSizing.labelMin,
            edgeSizing.labelMax,

            edgeSizing.labelOffsetMin,
            edgeSizing.labelOffsetMax,

            Object.prototype.hasOwnProperty.call(layout, 'mode')
              ? layout.mode

                  ? layout.layout_mode
                  : (Object.prototype.hasOwnProperty.call(layout, 'layoutMode')
                      ? layout.layoutMode
                      : (Object.prototype.hasOwnProperty.call(layout, 'type')
                          ? layout.type
                          : layout.name)))

          const mode = normalizeGraphLayoutMode(modeCandidate)
          if (mode) {

              const end = points[index]
              const point = {

                y: start.y + (end.y - start.y) * localT,

              const tangent = normalizeDirection(end.x - start.x, end.y - start.y)

            traversed += segmentLength

          const last = points[points.length - 1]
          return {
            point: { x: last.x, y: last.y },
            tangent: normalizeDirection(last.x - penultimate.x, last.y - penultimate.y),

            y: oneMinusT * oneMinusT * start.y + 2 * oneMinusT * t * control.y + t * t * end.y,

            const current = points[index]
            if (Math.hypot(current.x - previous.x, current.y - previous.y) < 0.0001) {

          const end = { x: edge.target.x, y: edge.target.y }

            type: 'line',
            start,
            end,
            labelPoint: {

            labelTangent: tangent,
            endTangent: tangent,

          }

            const toSample = sampleEdgePathGeometry(toGeometry, t)

          if (prunedPoints.length < 2) {

          const labelSample = samplePolyline(prunedPoints, 0.5)
          const endSample = samplePolyline(prunedPoints, 1)
          return {

            const durationMs = edgePathTransitionDurationMs(transition.durationMs)

            const progress = hasTiming

              transition?.from?.spec ?? currentPathState.spec,

            const toState = normalizedPathState(
              transition?.to?.style ?? currentPathState.style,
              transition?.to?.spec ?? currentPathState.spec,

              return buildEdgePathGeometryFromState(edge, toState)
            }

            const fromGeometry = buildEdgePathGeometryFromState(edge, fromState)
            const toGeometry = buildEdgePathGeometryFromState(edge, toState)
            return blendEdgePathGeometry(fromGeometry, toGeometry, easeInOutSmootherStep(progress))
          }

        function traceEdgePath(ctx, pathGeometry) {

          }
          if (geometry.type === 'polyline' && Array.isArray(geometry.points) && geometry.points.length >= 2) {
            ctx.moveTo(geometry.points[0].x, geometry.points[0].y)
            for (let index = 1; index < geometry.points.length; index += 1) {
              ctx.lineTo(geometry.points[index].x, geometry.points[index].y)
            }
            return
          }
          const start = geometry.start
          const end = geometry.end
          if (start && end) {
            ctx.moveTo(start.x, start.y)
            ctx.lineTo(end.x, end.y)
          }
        }

        registerEdgePathFunction('straight', buildStraightEdgePath)
        registerEdgePathFunction('bezier', buildBezierEdgePath)
        registerEdgePathFunction('orthogonal', buildOrthogonalEdgePath)
        registerEdgePathFunction('step', buildStepEdgePath)
        registerEdgePathFunction('loop', buildLoopEdgePath)
        registerEdgePathFunction('polyline', buildPolylineEdgePath)
        registerEdgePathFunction('arc', buildArcEdgePath)
        registerEdgePathFunction('radial', buildRadialEdgePath)

        function nodeLabelFontSize(node, nodeRadiusValue = null) {
          const nodeSizing = VISUALIZER_CONSTANTS.render.node
          const explicitLabelSize = finiteNumber(node?.labelSize)
          if (explicitLabelSize !== null) {
            return clamp(explicitLabelSize, nodeSizing.labelMin, nodeSizing.labelMax)
          }
          const radius = Number.isFinite(nodeRadiusValue) ? nodeRadiusValue : finiteNumber(node?.radius)
          if (!Number.isFinite(radius)) {
            return nodeSizing.defaultLabelSize
          }
          return clamp(
            radius * nodeSizing.labelScale,
            nodeSizing.labelMin,
            nodeSizing.labelMax,
          )
        }

        function layoutSingleGraph(graph) {
          // Local-graph layout stage. Explicit node.pos values are treated as fixed anchors.
          const nodes = graph.nodes
          const edges = graph.edges
          const total = nodes.length
          const graphLayout = graph && typeof graph.layout === 'object' ? graph.layout : null
          const layoutMode = normalizeGraphLayoutMode(graphLayout?.mode)
          const knownLayoutMode = (
            layoutMode === 'force'
            || layoutMode === 'spectral'
            || layoutMode === 'spiral'
            || layoutMode === 'circular'
            || layoutMode === 'shell'
            || layoutMode === 'radial'
            || layoutMode === 'tree'
            || layoutMode === 'orthogonal'
            || layoutMode === 'arc'
            || layoutMode === 'bipartite'
            || layoutMode === 'random'
          )
          const forceLikeLayout = !layoutMode || layoutMode === 'force' || !knownLayoutMode
          const spectralLayout = layoutMode === 'spectral'
          const spiralLayout = layoutMode === 'spiral'
          const circularLayout = layoutMode === 'circular' || layoutMode === 'radial' || layoutMode === 'shell'
          const shellLayout = layoutMode === 'shell'
          const treeLayout = layoutMode === 'tree'
          const orthogonalLayout = layoutMode === 'orthogonal'
          const arcLayout = layoutMode === 'arc'
          const bipartiteLayout = layoutMode === 'bipartite'
          const randomLayout = layoutMode === 'random'
          const configuredRadius = finiteNumber(graphLayout?.radius)
          const spreadRadius = (
            configuredRadius !== null && configuredRadius > 0
              ? configuredRadius
              : Math.max(120, total * 24)
          )

          if (total === 0) {
            return {
              nodes: [],
              edges: [],
              bounds: {
                minX: -120,
                maxX: 120,
                minY: -80,
                maxY: 80,
              },
            }
          }

          let treeDepthByIndex = null
          let treeRankByIndex = null
          let treeLayerSizes = null
          let treeLayerCount = 0

          if (treeLayout) {
            const indexById = new Map(nodes.map((node, index) => [node.id, index]))
            const depths = new Array(total).fill(0)
            const maxIterations = Math.min(256, Math.max(2, total * 2))
            for (let iteration = 0; iteration < maxIterations; iteration += 1) {
              let changed = false
              for (const edge of edges) {
                const sourceIndex = indexById.get(edge.source)
                const targetIndex = indexById.get(edge.target)
                if (sourceIndex == null || targetIndex == null || sourceIndex === targetIndex) {
                  continue
                }
                const candidateDepth = depths[sourceIndex] + 1
                if (candidateDepth > depths[targetIndex]) {
                  depths[targetIndex] = candidateDepth
                  changed = true
                }
              }
              if (!changed) {
                break
              }
            }

            const rawMaxDepth = depths.reduce((maxDepth, depth) => Math.max(maxDepth, depth), 0)
            const maxDepth = Math.min(rawMaxDepth, Math.max(1, total - 1))
            const clampedDepths = depths.map((depth) => clamp(depth, 0, maxDepth))
            const layers = Array.from({ length: maxDepth + 1 }, () => [])
            for (let index = 0; index < total; index += 1) {
              layers[clampedDepths[index]].push(index)
            }
            const ranks = new Array(total).fill(0)
            const layerSizes = new Array(layers.length).fill(1)
            for (let layerIndex = 0; layerIndex < layers.length; layerIndex += 1) {
              const layer = layers[layerIndex]
              const size = Math.max(1, layer.length)
              layerSizes[layerIndex] = size
              for (let rank = 0; rank < layer.length; rank += 1) {
                ranks[layer[rank]] = rank
              }
            }

            treeDepthByIndex = clampedDepths
            treeRankByIndex = ranks
            treeLayerSizes = layerSizes
            treeLayerCount = layers.length
          }

          function resolveAutoNodePosition(node, index) {
            const nodeId = String(node?.id ?? index)
            const angle = (Math.PI * 2 * index) / Math.max(1, total)

            if (orthogonalLayout) {
              const columns = Math.max(1, Math.ceil(Math.sqrt(total)))
              const rows = Math.max(1, Math.ceil(total / columns))
              const column = index % columns
              const row = Math.floor(index / columns)
              return {
                x: (column - (columns - 1) * 0.5) * 112,
                y: (row - (rows - 1) * 0.5) * 96,
              }
            }

            if (bipartiteLayout) {
              const leftCount = Math.ceil(total * 0.5)
              const onLeft = index < leftCount
              const rank = onLeft ? index : index - leftCount
              const rankTotal = onLeft ? leftCount : Math.max(1, total - leftCount)
              return {
                x: (onLeft ? -1 : 1) * Math.max(120, spreadRadius * 0.72),
                y: (rank - (rankTotal - 1) * 0.5) * 92,
              }
            }

            if (treeLayout && treeDepthByIndex && treeRankByIndex && treeLayerSizes) {
              const depth = treeDepthByIndex[index] ?? 0
              const layerSize = treeLayerSizes[depth] ?? 1
              const rank = treeRankByIndex[index] ?? 0
              return {
                x: (depth - (treeLayerCount - 1) * 0.5) * 134,
                y: (rank - (layerSize - 1) * 0.5) * 96,
              }
            }

            if (arcLayout) {
              const startAngle = -Math.PI * 0.92
              const endAngle = -Math.PI * 0.08
              const t = total <= 1 ? 0.5 : index / (total - 1)
              const angleOnArc = startAngle + (endAngle - startAngle) * t
              return {
                x: Math.cos(angleOnArc) * spreadRadius,
                y: Math.sin(angleOnArc) * spreadRadius * 0.72,
              }
            }

            if (randomLayout) {
              const xNoise = (hashString(`${nodeId}:x`) % 2001) / 1000 - 1
              const yNoise = (hashString(`${nodeId}:y`) % 2001) / 1000 - 1
              return {
                x: xNoise * spreadRadius,
                y: yNoise * spreadRadius * 0.82,
              }
            }

            if (spiralLayout) {
              const baseRadius = Math.max(42, spreadRadius * 0.18)
              const radiusStep = Math.max(26, spreadRadius * 0.11)
              const theta = index * 0.9
              const radial = baseRadius + radiusStep * index
              return {
                x: Math.cos(theta) * radial,
                y: Math.sin(theta) * radial * 0.78,
              }
            }

            if (spectralLayout) {
              const degreeBias = (hashString(`${nodeId}:deg`) % 9) / 14
              const ringScale = 0.6 + degreeBias
              return {
                x: Math.cos(angle) * spreadRadius * ringScale,
                y: Math.sin(angle) * spreadRadius * ringScale,
              }
            }

            if (circularLayout) {
              const shellScale = shellLayout
                ? (0.58 + (hashString(`${nodeId}:shell`) % 3) * 0.21)
                : 1
              return {
                x: Math.cos(angle) * spreadRadius * shellScale,
                y: Math.sin(angle) * spreadRadius * shellScale,
              }
            }

            // Force/default mode keeps the existing circular seed + deterministic jitter.
            const jitter = ((hashString(nodeId) % 1000) / 1000 - 0.5) * 14
            const defaultRadius = Math.max(120, total * 24)
            return {
              x: Math.cos(angle) * defaultRadius + jitter,
              y: Math.sin(angle) * defaultRadius - jitter,
            }
          }

          const positions = nodes.map((node, index) => {
            const storedPos = Array.isArray(node.pos) && node.pos.length >= 2 ? node.pos : null
            const fixed = storedPos !== null
            const autoPosition = resolveAutoNodePosition(node, index)
            const radius = nodeRadius(node)
            return {
              x: fixed ? Number(storedPos[0]) : autoPosition.x,
              y: fixed ? Number(storedPos[1]) : autoPosition.y,
              fixed,
              radius,
              labelSize: nodeLabelFontSize(node, radius),
              labelColor: nodeLabelColor(node),
              fillColor: nodeFillColor(node),
              strokeColor: nodeStrokeColor(node),
              strokeWidth: nodeStrokeWidth(node),
              displayLabel: node.displayLabel !== false,
            }
          })

          const indexById = new Map(nodes.map((node, index) => [node.id, index]))
          const movableCount = positions.reduce((count, node) => count + (node.fixed ? 0 : 1), 0)

          if (forceLikeLayout && movableCount > 0 && total <= 84 && edges.length > 0) {
            const springLength = clamp(180 / Math.sqrt(total), 48, 110)
            let temperature = Math.max(18, springLength * 0.36)

            for (let iteration = 0; iteration < 220; iteration += 1) {
              const forceX = new Array(total).fill(0)
              const forceY = new Array(total).fill(0)

              for (let i = 0; i < total; i += 1) {
                for (let j = i + 1; j < total; j += 1) {
                  const dx = positions[i].x - positions[j].x
                  const dy = positions[i].y - positions[j].y
                  const distance = Math.hypot(dx, dy) + 0.01
                  const repulsion = (springLength * springLength) / distance
                  const ux = dx / distance
                  const uy = dy / distance
                  forceX[i] += ux * repulsion
                  forceY[i] += uy * repulsion
                  forceX[j] -= ux * repulsion
                  forceY[j] -= uy * repulsion
                }
              }

              for (const edge of edges) {
                const sourceIndex = indexById.get(edge.source)
                const targetIndex = indexById.get(edge.target)
                if (sourceIndex == null || targetIndex == null || sourceIndex === targetIndex) {
                  continue
                }

                const dx = positions[sourceIndex].x - positions[targetIndex].x
                const dy = positions[sourceIndex].y - positions[targetIndex].y
                const distance = Math.hypot(dx, dy) + 0.01
                const attraction = (distance * distance) / (springLength * 1.2)
                const ux = dx / distance
                const uy = dy / distance

                forceX[sourceIndex] -= ux * attraction
                forceY[sourceIndex] -= uy * attraction
                forceX[targetIndex] += ux * attraction
                forceY[targetIndex] += uy * attraction
              }

              for (let index = 0; index < total; index += 1) {
                if (positions[index].fixed) {
                  continue
                }
                const dx = forceX[index]
                const dy = forceY[index]
                const distance = Math.hypot(dx, dy)
                if (distance < 0.0001) {
                  continue
                }
                const step = Math.min(temperature, distance)
                positions[index].x += (dx / distance) * step
                positions[index].y += (dy / distance) * step
              }

              temperature *= 0.968
            }
          }

          let minX = Number.POSITIVE_INFINITY
          let maxX = Number.NEGATIVE_INFINITY
          let minY = Number.POSITIVE_INFINITY
          let maxY = Number.NEGATIVE_INFINITY

          for (const point of positions) {
            const labelPad = point.displayLabel ? 12 : 10
            minX = Math.min(minX, point.x - point.radius - labelPad)
            maxX = Math.max(maxX, point.x + point.radius + labelPad)
            minY = Math.min(minY, point.y - point.radius - labelPad)
            maxY = Math.max(maxY, point.y + point.radius + 14)
          }

          const nodeViews = nodes.map((node, index) => ({
            id: node.id,
            label: node.label,
            uid: node.uid,
            nodeIndex: node.nodeIndex,
            localX: positions[index].x,
            localY: positions[index].y,
            radius: positions[index].radius,
            labelSize: positions[index].labelSize,
            labelColor: positions[index].labelColor,
            fillColor: positions[index].fillColor,
            strokeColor: positions[index].strokeColor,
            strokeWidth: positions[index].strokeWidth,
            displayLabel: positions[index].displayLabel,
            posProvided: node.posProvided === true,
          }))

          return {
            nodes: nodeViews,
            edges,
            bounds: { minX, maxX, minY, maxY },
          }
        }

        function rebuildWorldLayout(previousRenderByGraphName = null) {
          // World-layout stage: place each local graph into gallery coordinates and
          // materialize graph.render, the draw-ready model consumed by drawGallery().
          const graphs = graphGallery.value
          if (!Array.isArray(graphs) || graphs.length === 0) {
            worldBounds = { ...VISUALIZER_CONSTANTS.viewport.defaultWorldBounds }
            return
          }

          const maxColumns = graphs.length > 1 ? 2 : 1
          let cursorX = 0
          let cursorY = 0
          let rowHeight = 0
          let columnIndex = 0

          let minX = Number.POSITIVE_INFINITY
          let maxX = Number.NEGATIVE_INFINITY
          let minY = Number.POSITIVE_INFINITY
          let maxY = Number.NEGATIVE_INFINITY

          for (const graph of graphs) {
            const graphKey = graphStableKey(graph)
            const previousRender = (
              (previousRenderByGraphName && previousRenderByGraphName.get(graphKey))
              || graphRenderMemory.get(graphKey)
            )

            if (previousRender && Array.isArray(previousRender.nodes) && Array.isArray(graph.nodes)) {
              const previousById = new Map(previousRender.nodes.map((node) => [node.id, node]))
              const previousByUid = new Map(previousRender.nodes
                .filter((node) => typeof node?.uid === 'string' && node.uid)
                .map((node) => [node.uid, node]))
              for (const node of graph.nodes) {
                if (!node || node.posProvided === true || (Array.isArray(node.pos) && node.pos.length >= 2)) {
                  continue
                }
                let previousNode = null
                if (typeof node.uid === 'string' && node.uid) {
                  previousNode = previousByUid.get(node.uid) || null
                }
                if (!previousNode && node.id != null) {
                  previousNode = previousById.get(String(node.id)) || null
                }
                if (!previousNode) {
                  previousNode = findNodeByIdentity(previousRender.nodes, nodeIdentityFromNode(node))
                }
                // Matching order mirrors strict patch/sync identity semantics: uid -> id -> index.
                if (!previousNode) {
                  continue
                }
                const px = Number(previousNode.localX)
                const py = Number(previousNode.localY)
                if (!Number.isFinite(px) || !Number.isFinite(py)) {
                  continue
                }
                // Keep layout stable when a snapshot is temporarily missing freshly synced Node.pos values.
                node.pos = [px, py]
              }
            }

            const local = layoutSingleGraph(graph)
            const width = Math.max(
              VISUALIZER_CONSTANTS.layout.minGraphWidth,
              local.bounds.maxX - local.bounds.minX + 68,
            )
            const height = Math.max(
              VISUALIZER_CONSTANTS.layout.minGraphHeight,
              local.bounds.maxY - local.bounds.minY + 70,
            )

            let offsetX
            let offsetY

            if (previousRender
              && Number.isFinite(previousRender.offsetX)
              && Number.isFinite(previousRender.offsetY)) {
              // Preserve prior placement so node drags don't re-anchor the whole graph on refresh.
              offsetX = previousRender.offsetX
              offsetY = previousRender.offsetY
            } else {
              if (columnIndex >= maxColumns) {
                columnIndex = 0
                cursorX = 0
                cursorY += rowHeight + VISUALIZER_CONSTANTS.layout.graphRowGap
                rowHeight = 0
              }

              offsetX = cursorX - local.bounds.minX + VISUALIZER_CONSTANTS.layout.graphOffsetX
              offsetY = cursorY - local.bounds.minY + VISUALIZER_CONSTANTS.layout.graphOffsetY
              cursorX += width + VISUALIZER_CONSTANTS.layout.graphColumnGap
              rowHeight = Math.max(rowHeight, height)
              columnIndex += 1
            }

            const worldNodes = local.nodes.map((node) => ({
              ...node,
              x: node.localX + offsetX,
              y: node.localY + offsetY,
            }))

            const pointById = new Map(worldNodes.map((node) => [node.id, node]))
            const previousRenderEdges = Array.isArray(previousRender?.edges) ? previousRender.edges : []
            function findPreviousRenderedEdgeForNextEdge(nextEdge) {
              if (!Array.isArray(previousRenderEdges) || previousRenderEdges.length === 0) {
                return null
              }
              if (typeof nextEdge?.uid === 'string' && nextEdge.uid) {
                const byUid = previousRenderEdges.find((candidate) => candidate?.uid === nextEdge.uid)
                if (byUid) {
                  return byUid
                }
              }
              if (Number.isInteger(nextEdge?.edgeIndex)) {
                const byIndex = previousRenderEdges.find((candidate) => candidate?.edgeIndex === nextEdge.edgeIndex)
                if (byIndex) {
                  return byIndex
                }
              }
              return previousRenderEdges.find((candidate) => (
                String(candidate?.sourceId ?? '') === String(nextEdge?.sourceId ?? '')
                && String(candidate?.targetId ?? '') === String(nextEdge?.targetId ?? '')
                && String(candidate?.label ?? '') === String(nextEdge?.label ?? '')
              )) || null
            }

            const worldEdges = local.edges
              .map((edge) => {
                const source = pointById.get(edge.source)
                const target = pointById.get(edge.target)
                if (!source || !target) {
                  return null
                }
                const width = edgeStrokeWidth(edge)
                const pathStyle = normalizeEdgePathStyle(edge.pathStyle, EDGE_PATH_STYLE_DEFAULT)
                const pathSpec = normalizeEdgePathSpec(edge.pathSpec)
                const nextEdge = {
                  uid: typeof edge.uid === 'string' ? edge.uid : '',
                  edgeIndex: Number.isInteger(edge.edgeIndex) && edge.edgeIndex >= 0 ? edge.edgeIndex : null,
                  source,
                  target,
                  sourceId: source.id,
                  targetId: target.id,
                  sourceUid: typeof source.uid === 'string' ? source.uid : '',
                  targetUid: typeof target.uid === 'string' ? target.uid : '',
                  sourceNodeIndex: Number.isInteger(source.nodeIndex) ? source.nodeIndex : null,
                  targetNodeIndex: Number.isInteger(target.nodeIndex) ? target.nodeIndex : null,
                  color: edgeColor(edge),
                  width,
                  arrowSize: edgeArrowSize(width),
                  labelOffset: edgeLabelOffset(width),
                  labelSize: edgeLabelFontSize(width),
                  displayLabel: !!edge.displayLabel && !!edge.label,
                  label: edge.label || '',
                  pathStyle,
                  pathSpec,
                }
                const previousEdge = findPreviousRenderedEdgeForNextEdge(nextEdge)
                if (previousEdge) {
                  const previousPath = normalizedPathState(previousEdge.pathStyle, previousEdge.pathSpec)
                  const nextPath = normalizedPathState(pathStyle, pathSpec)
                  if (
                    previousPath.style !== nextPath.style
                    || !edgePathSpecEquals(previousPath.spec, nextPath.spec)
                  ) {
                    nextEdge.pathTransition = {
                      from: previousPath,
                      to: nextPath,
                      startedAt: performance.now(),
                      durationMs: edgePathTransitionDurationMs(),
                    }
                  } else if (previousEdge.pathTransition && typeof previousEdge.pathTransition === 'object') {
                    const previousTransition = previousEdge.pathTransition
                    const transitionFrom = normalizedPathState(
                      previousTransition?.from?.style,
                      previousTransition?.from?.spec,
                    )
                    const transitionTo = normalizedPathState(
                      previousTransition?.to?.style ?? previousPath.style,
                      previousTransition?.to?.spec ?? previousPath.spec,
                    )
                    if (
                      transitionTo.style === nextPath.style
                      && edgePathSpecEquals(transitionTo.spec, nextPath.spec)
                    ) {
                      nextEdge.pathTransition = {
                        from: transitionFrom,
                        to: transitionTo,
                        startedAt: Number(previousTransition.startedAt),
                        durationMs: edgePathTransitionDurationMs(previousTransition.durationMs),
                      }
                    }
                  }
                }
                return nextEdge
              })
              .filter((edge) => edge !== null)

            graph.render = {
              title: graph.title || graph.name,
              displayLabel: graph.displayLabel !== false,
              directed: graph.directed,
              uid: graph.uid,
              graphKey,
              graphName: graph.name,
              offsetX,
              offsetY,
              titleX: (local.bounds.minX + local.bounds.maxX) / 2 + offsetX,
              titleY: local.bounds.minY + offsetY - VISUALIZER_CONSTANTS.layout.titleOffsetY,
              nodes: worldNodes,
              edges: worldEdges,
            }
            graphRenderMemory.set(graphKey, {
              offsetX,
              offsetY,
              nodes: worldNodes.map((node) => ({
                id: node.id,
                uid: node.uid,
                nodeIndex: node.nodeIndex,
                label: node.label,
                localX: node.localX,
                localY: node.localY,
              })),
            })

            for (const node of worldNodes) {
              const rightPad = node.displayLabel
                ? VISUALIZER_CONSTANTS.layout.nodeLabelRightPadding
                : VISUALIZER_CONSTANTS.layout.nodeNoLabelPadding
              const topPad = node.displayLabel
                ? VISUALIZER_CONSTANTS.layout.nodeLabelTopPadding
                : VISUALIZER_CONSTANTS.layout.nodeNoLabelPadding
              minX = Math.min(minX, node.x - node.radius - VISUALIZER_CONSTANTS.layout.nodeBoundsPadding)
              maxX = Math.max(maxX, node.x + node.radius + rightPad)
              minY = Math.min(minY, node.y - node.radius - topPad)
              maxY = Math.max(maxY, node.y + node.radius + VISUALIZER_CONSTANTS.layout.nodeBottomPadding)
            }
          }

          worldBounds = {
            minX,
            maxX,
            minY,
            maxY,
          }
        }

        function fitCameraToWorld(force = false) {
          if (!force && hasMovedCamera.value) {
            return
          }

          const metrics = getCanvasMetrics()
          if (!metrics) {
            return
          }

          const { width, height } = metrics
          const worldWidth = Math.max(1, worldBounds.maxX - worldBounds.minX)
          const worldHeight = Math.max(1, worldBounds.maxY - worldBounds.minY)

          const targetScale = clamp(
            Math.min(
              (width - VISUALIZER_CONSTANTS.viewport.fitPadding) / worldWidth,
              (height - VISUALIZER_CONSTANTS.viewport.fitPadding) / worldHeight,
            ),
            VISUALIZER_CONSTANTS.viewport.fitScaleMin,
            VISUALIZER_CONSTANTS.viewport.fitScaleMax,
          )

          const centerX = (worldBounds.minX + worldBounds.maxX) / 2
          const centerY = (worldBounds.minY + worldBounds.maxY) / 2

          cameraScale.value = targetScale
          cameraOffsetX.value = width / 2 - centerX * targetScale
          cameraOffsetY.value = height / 2 - centerY * targetScale
        }

        function parseNotebookCamera(payload) {
          const raw = payload?.camera
          if (!raw || typeof raw !== 'object') {
            return null
          }
          const name = typeof raw.name === 'string' && raw.name ? raw.name : ''
          const center = Array.isArray(raw.center) ? raw.center : []
          const cx = Number(center[0])
          const cy = Number(center[1])
          const cz = Number(center[2])
          const height = Number(raw.height)

          if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(cz) || !Number.isFinite(height)) {
            return null
          }

          return {
            name,
            center: [cx, cy, cz],
            height,
            moving: !!raw.moving,
          }
        }

        function parseNotebookCanvas(payload) {
          const raw = payload?.canvas
          if (!raw || typeof raw !== 'object') {
            return null
          }
          const backgroundColor = raw.background_color == null ? '' : String(raw.background_color)
          if (!backgroundColor.trim()) {
            return null
          }
          return {
            name: typeof raw.name === 'string' && raw.name ? raw.name : '',
            backgroundColor,
          }
        }

        function applyNotebookCamera(cameraState) {
          const metrics = getCanvasMetrics()
          if (!metrics) {
            return
          }

          const { width, height } = metrics
          const [centerX, centerY] = cameraState.center
          const desiredHeight = clamp(
            Math.abs(cameraState.height),
            VISUALIZER_CONSTANTS.viewport.notebookCameraHeightMin,
            VISUALIZER_CONSTANTS.viewport.notebookCameraHeightMax,
          )
          const targetScale = clamp(
            height / desiredHeight,
            VISUALIZER_CONSTANTS.viewport.notebookCameraScaleMin,
            VISUALIZER_CONSTANTS.viewport.notebookCameraScaleMax,
          )

          cameraScale.value = targetScale
          cameraOffsetX.value = width / 2 - centerX * targetScale
          cameraOffsetY.value = height / 2 - centerY * targetScale
        }

        function getViewportCameraState() {
          const metrics = getCanvasMetrics()
          if (!metrics) {
            return null
          }

          const { width, height } = metrics
          const scale = cameraScale.value
          if (!Number.isFinite(scale) || scale <= 0.0001) {
            return null
          }

          const centerX = (width / 2 - cameraOffsetX.value) / scale
          const centerY = (height / 2 - cameraOffsetY.value) / scale
          const centerZ = notebookCameraZ.value
          const worldHeight = height / scale

              const modelNode = findNodeByIdentity(modelNodes, nodeIdentityFromNode(node))
              if (!modelNode) {
                continue
              }

              const pos = [node.localX, node.localY]
              modelNode.pos = pos
              modelNode.posProvided = true
              node.posProvided = true

              queueNodePosSync({
                graphUid: graph.uid,
                graphName: graph.name,
                nodeUid: node.uid,
                nodeId: node.id,
                nodeIndex: node.nodeIndex,
                pos,
              }, 0)
              queuedCount += 1
            }
          }
          return queuedCount
        }

        async function flushPendingNodePosSync(maxPasses = 3) {
          let followUpDelayMs = 0
          for (let pass = 0; pass < maxPasses; pass += 1) {
            if (pendingNodePosUpdates.size === 0) {
              return
            }
            const outcome = await syncNotebookNodePositions()
            if (pendingNodePosUpdates.size === 0) {
              return
            }
            if (!outcome || outcome.requeue !== true) {
              return
            }
            const delayMs = Number(outcome.delayMs)
            if (Number.isFinite(delayMs) && delayMs > 0) {
              followUpDelayMs = delayMs
              break
            }
          }
          if (pendingNodePosUpdates.size > 0) {
            queueNodePosSyncFlush(followUpDelayMs)
          }
        }

        function drawArrowhead(ctx, edge, pathGeometry, size) {
          if (!edge || !edge.target) {
            return
          }

          const fallbackDirection = normalizeDirection(
            edge.target.x - edge.source.x,
            edge.target.y - edge.source.y,
          )
          const endTangent = pathGeometry?.endTangent
          const tangent = (
            endTangent
            && Number.isFinite(endTangent.x)
            && Number.isFinite(endTangent.y)
          )
            ? normalizeDirection(endTangent.x, endTangent.y)
            : fallbackDirection

          const ux = tangent.x
          const uy = tangent.y
          const target = edge.target
          const tipInset = target.radius + Math.max(2, target.strokeWidth * 0.5)
          const tipX = target.x - ux * tipInset
          const tipY = target.y - uy * tipInset
          const wingX = -uy
          const wingY = ux

          ctx.beginPath()
          ctx.moveTo(tipX, tipY)
          ctx.lineTo(tipX - ux * size + wingX * size * 0.58, tipY - uy * size + wingY * size * 0.58)
          ctx.lineTo(tipX - ux * size - wingX * size * 0.58, tipY - uy * size - wingY * size * 0.58)
          ctx.closePath()
          ctx.fill()
        }

        function clearNodeLabelOverlay() {
          // Remove all overlay DOM nodes; map ownership is authoritative for reuse/cleanup.
          for (const labelElement of nodeLabelElements.values()) {
            labelElement.remove()
          }
          nodeLabelElements.clear()
        }

        function parseLatexLabelExpression(rawLabel) {
          const trimmed = rawLabel.trim()
          if (trimmed.length >= 4 && trimmed.startsWith('$$') && trimmed.endsWith('$$')) {
            const expression = trimmed.slice(2, -2).trim()
            return expression || null
          }
          if (trimmed.length >= 2 && trimmed.startsWith('$') && trimmed.endsWith('$')) {
            const expression = trimmed.slice(1, -1).trim()
            return expression || null
          }
          return null
        }

        function renderLatexLabelMarkup(rawLabel) {
          const expression = parseLatexLabelExpression(rawLabel)
          if (!expression) {
            return null
          }
          // Cache by normalized expression so repeated labels avoid KaTeX re-render work.
          if (latexLabelMarkupCache.has(expression)) {
            return latexLabelMarkupCache.get(expression)
          }
          let markup = null
          try {
            markup = katex.renderToString(expression, {
              throwOnError: false,
              displayMode: false,
              strict: 'ignore',
              trust: false,
            })
          } catch (error) {
            markup = null
          }
          latexLabelMarkupCache.set(expression, markup)
          return markup
        }

        function setNodeLabelElementContent(labelElement, labelText) {
          const cachedLabel = labelElement.dataset.labelText ?? ''
          const cachedMode = labelElement.dataset.renderMode ?? ''
          const latexMarkup = renderLatexLabelMarkup(labelText)
          if (latexMarkup) {
            // Avoid rewriting DOM when neither text nor render mode changed.
            if (cachedMode !== 'latex' || cachedLabel !== labelText) {
              labelElement.innerHTML = latexMarkup
              labelElement.dataset.renderMode = 'latex'
              labelElement.dataset.labelText = labelText
            }
            return
          }
          if (cachedMode !== 'plain' || cachedLabel !== labelText) {
            labelElement.textContent = labelText
            labelElement.dataset.renderMode = 'plain'
            labelElement.dataset.labelText = labelText
          }
        }

        function syncNodeLabelOverlay() {
          // Label overlay pass runs after canvas draw and mirrors current world->screen camera transform.
          const overlayElement = nodeLabelOverlayRef.value
          if (!overlayElement) {
            clearNodeLabelOverlay()
            return
          }

          const graphs = graphGallery.value
          if (!Array.isArray(graphs) || graphs.length === 0) {
            clearNodeLabelOverlay()
            return
          }

          const scale = Number(cameraScale.value)
          const offsetX = Number(cameraOffsetX.value)
          const offsetY = Number(cameraOffsetY.value)
          if (!Number.isFinite(scale) || scale <= 0 || !Number.isFinite(offsetX) || !Number.isFinite(offsetY)) {
            clearNodeLabelOverlay()
            return
          }

          const activeNodeKeys = new Set()
          for (const graph of graphs) {
            const render = graph?.render
            if (!render || !Array.isArray(render.nodes)) {
              continue
            }
            const graphKey = (
              typeof render.graphKey === 'string' && render.graphKey
                ? render.graphKey
                : graphStableKey(graph)
            )

            for (const node of render.nodes) {
              if (!node || node.displayLabel === false) {
                continue
              }
              const labelText = node.label == null ? '' : String(node.label)
              if (!labelText) {
                continue
              }
              const screenX = node.x * scale + offsetX
              const screenY = node.y * scale + offsetY
              if (!Number.isFinite(screenX) || !Number.isFinite(screenY)) {
                continue
              }
              const nodeId = node.id == null ? '' : String(node.id)
              if (!nodeId) {
                continue
              }
              const nodeKey = `${graphKey}::${nodeId}`
              activeNodeKeys.add(nodeKey)

              // Reuse a single DOM node per graph/node key across frames.
              let labelElement = nodeLabelElements.get(nodeKey)
              if (!labelElement) {
                labelElement = document.createElement('div')
                labelElement.className = 'graph-node-label'
                nodeLabelElements.set(nodeKey, labelElement)
                overlayElement.appendChild(labelElement)
              } else if (labelElement.parentElement !== overlayElement) {
                overlayElement.appendChild(labelElement)
              }

              const labelSizeRaw = Number(node.labelSize)
              const baseLabelSize = (
                Number.isFinite(labelSizeRaw) && labelSizeRaw > 0
                  ? labelSizeRaw
                  : VISUALIZER_CONSTANTS.render.node.defaultLabelSize
              )
              const scaledLabelSize = Math.max(1, baseLabelSize * scale)

              labelElement.style.left = `${screenX}px`
              labelElement.style.top = `${screenY}px`
              labelElement.style.fontSize = `${scaledLabelSize}px`
              labelElement.style.fontFamily = VISUALIZER_FONT_FAMILY
              labelElement.style.color = resolveColor(
                node.labelColor,
                VISUALIZER_CONSTANTS.render.colors.nodeLabel,
              )

              setNodeLabelElementContent(labelElement, labelText)
            }
          }

          for (const [nodeKey, labelElement] of nodeLabelElements.entries()) {
            if (activeNodeKeys.has(nodeKey)) {
              continue
            }
            // Clean up labels for nodes/graphs that disappeared in the latest render.
            labelElement.remove()
            nodeLabelElements.delete(nodeKey)
          }
        }

        function drawGallery() {
          if (!isComponentAlive) {
            clearNodeLabelOverlay()
            return
          }

          const metrics = getCanvasMetrics()
          if (!metrics) {
            clearNodeLabelOverlay()
            return
          }

          const { ctx, width, height } = metrics

          ctx.clearRect(0, 0, width, height)

          ctx.fillStyle = visualizerCanvasBackground.value
          ctx.fillRect(0, 0, width, height)

          const graphs = graphGallery.value
          if (!Array.isArray(graphs) || graphs.length === 0) {
            clearNodeLabelOverlay()
            return
          }

          ctx.save()
          ctx.translate(cameraOffsetX.value, cameraOffsetY.value)
          ctx.scale(cameraScale.value, cameraScale.value)

          ctx.lineCap = 'round'
          ctx.lineJoin = 'round'

          // Paint order keeps geometry under labels and avoids overdraw artifacts.
          for (const graph of graphs) {
            if (!graph.render) {
              continue
            }

            const renderedEdges = []
            for (const edge of graph.render.edges) {
              const pathGeometry = buildEdgePathGeometry(edge)
              renderedEdges.push({ edge, pathGeometry })
              ctx.strokeStyle = edge.color
              ctx.lineWidth = edge.width
              ctx.beginPath()
              traceEdgePath(ctx, pathGeometry)
              ctx.stroke()
            }

            if (graph.render.directed) {
              for (const { edge, pathGeometry } of renderedEdges) {
                ctx.fillStyle = edge.color
                drawArrowhead(ctx, edge, pathGeometry, edge.arrowSize)
              }
            }

            for (const { edge, pathGeometry } of renderedEdges) {
              if (!edge.displayLabel) {
                continue
              }
              const labelPoint = pathGeometry?.labelPoint
              const labelTangent = pathGeometry?.labelTangent
              const tangent = (
                labelTangent
                && Number.isFinite(labelTangent.x)
                && Number.isFinite(labelTangent.y)
              )
                ? normalizeDirection(labelTangent.x, labelTangent.y)
                : normalizeDirection(edge.target.x - edge.source.x, edge.target.y - edge.source.y)
              const labelBase = (
                labelPoint
                && Number.isFinite(labelPoint.x)
                && Number.isFinite(labelPoint.y)
              )
                ? labelPoint
                : {
                  x: (edge.source.x + edge.target.x) * 0.5,
                  y: (edge.source.y + edge.target.y) * 0.5,
                }
              const normal = { x: -tangent.y, y: tangent.x }
              const midX = labelBase.x + normal.x * edge.labelOffset
              const midY = labelBase.y + normal.y * edge.labelOffset

              ctx.fillStyle = edge.color
              ctx.textAlign = 'center'
              ctx.textBaseline = 'middle'
              ctx.font = `italic ${edge.labelSize}px ${VISUALIZER_FONT_FAMILY}`
              ctx.fillText(edge.label, midX, midY)
            }

            for (const node of graph.render.nodes) {
              ctx.save()
              ctx.fillStyle = node.fillColor
              ctx.beginPath()
              ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2)
              ctx.fill()
              if (node.strokeWidth > 0) {
                ctx.lineWidth = node.strokeWidth
                ctx.strokeStyle = node.strokeColor
                ctx.stroke()
              }
              ctx.restore()
            }

            ctx.fillStyle = VISUALIZER_CONSTANTS.render.colors.graphTitle
            if (graph.render.displayLabel) {
              ctx.textAlign = 'center'
              ctx.textBaseline = 'middle'
              ctx.font = `italic ${VISUALIZER_CONSTANTS.render.graph.titleSize}px ${VISUALIZER_FONT_FAMILY}`
              ctx.fillText(graph.render.title, graph.render.titleX, graph.render.titleY)
            }
          }

          ctx.restore()
          // Node labels are rendered in DOM (for KaTeX support), synced after canvas paint.
          syncNodeLabelOverlay()
        }

        function pruneGraphRenderMemory(graphs) {
          const activeGraphKeys = new Set()
          if (Array.isArray(graphs)) {
            for (const graph of graphs) {
              const graphKey = graphStableKey(graph)
              if (graphKey) {
                activeGraphKeys.add(graphKey)
              }
            }
          }
          for (const graphKey of graphRenderMemory.keys()) {
            if (!activeGraphKeys.has(graphKey)) {
              graphRenderMemory.delete(graphKey)
            }
          }
        }

        async function applySnapshot(payload) {
          if (!isComponentAlive) {
            return
          }

          const previousRenderByGraphName = new Map(graphRenderMemory)
          for (const graph of graphGallery.value) {
            if (graph && graph.render && typeof graph.name === 'string' && graph.name) {
              previousRenderByGraphName.set(graphStableKey(graph), graph.render)
            }
          }

          const previousCount = graphGallery.value.length
          // Snapshot pipeline: normalize payload -> reapply pending local positions ->
          // rebuild world layout/render model -> prune stale render memory.
          graphGallery.value = normalizeGraphPayload(payload)
          pruneStalePendingNodePosUpdates()
          applyPendingNodePosToGraphs(graphGallery.value)
          rebuildWorldLayout(previousRenderByGraphName)
          pruneGraphRenderMemory(graphGallery.value)

          if (activeNodeDrag.value
            && Number.isFinite(activeNodeDrag.value.worldX)
            && Number.isFinite(activeNodeDrag.value.worldY)) {
            updateNodePositionInRender(activeNodeDrag.value)
          }

          // Initial node-position writeback is queued asynchronously.
          // Do not block snapshot application on that sync path.
          queueInitialNodePositionSync()

          if (previousCount === 0 && graphGallery.value.length > 0) {
            hasMovedCamera.value = false
          }

          const hadNotebookCamera = cameraControlledByNotebook.value
          const notebookCamera = parseNotebookCamera(payload)
          const notebookCanvas = parseNotebookCanvas(payload)
          cameraControlledByNotebook.value = notebookCamera !== null

          if (notebookCanvas) {
            visualizerCanvasBackground.value = resolveColor(notebookCanvas.backgroundColor, '#ffffff')
          } else {
            visualizerCanvasBackground.value = '#ffffff'
          }

          if (notebookCamera) {
            notebookCameraName.value = notebookCamera.name
            notebookCameraZ.value = notebookCamera.center[2]
            const shouldApplyNotebookCamera =
              Date.now() >= notebookCameraOverrideUntil
              && !isPanningCamera.value
              && !activeNodeDrag.value

            if (shouldApplyNotebookCamera) {
              applyNotebookCamera(notebookCamera)
            }
          } else {
            animationPlaybackWasActive = false
            notebookCameraName.value = ''
            // Avoid viewport jumps when camera is temporarily unavailable during kernel transitions.
            if (!hadNotebookCamera) {
              fitCameraToWorld(false)
            }
          }

          if (Array.isArray(graphGallery.value) && graphGallery.value.length > 0) {
            const playbackDelay = (
              notebookCamera && notebookCamera.moving
                ? VISUALIZER_CONSTANTS.sync.graphRefreshWhileNotebookCameraMovingMs
                : 0
            )
            const probeFrames = (
              playbackDelay > 0
                ? 0
                : VISUALIZER_CONSTANTS.sync.animationPlaybackProbeFrames
            )
            queueAnimationPlayback(playbackDelay, { probeFrames })
          } else {
            animationPlaybackJob.cancel()
            animationPlaybackWasActive = false
            animationPlaybackProbeFramesRemaining = 0
          }

          drawGallery()
          if (hasActiveEdgePathTransitions()) {
            scheduleEdgePathTransitionFrame()
          }
        }

        async function refreshGraphs() {
          const instance = pyodideRef.value
          if (!instance || typeof instance.runPythonAsync !== 'function') {
            await applySnapshot({ graphs: [] })
            return null
          }

          let rawResult = null

          try {
            rawResult = await runSerializedKernelTask(() => instance.runPythonAsync(GRAPH_SNAPSHOT_SOURCE))
            if (!isComponentAlive) {
              return null
            }
            const text = typeof rawResult === 'string' ? rawResult : String(rawResult)
            const payload = JSON.parse(text)
            await applySnapshot(payload)
          } catch (error) {
            console.error(error)
          } finally {
            destroyPyProxy(rawResult)
          }

          return null
        }

        const graphRefreshJob = createQueuedAsyncJob(refreshGraphs)

        function queueGraphRefresh(delayMs = 0) {
          const waitMs = Number(delayMs)
          if (Number.isFinite(waitMs) && waitMs <= 0) {
            void graphRefreshJob.run()
            return
          }
          graphRefreshJob.queue(delayMs)
        }

        function onPointerMove(event) {
          if (!resizing.value || window.innerWidth <= DESKTOP_BREAKPOINT) {
            return
          }

          const { minLeft, maxLeft } = calculateBounds()
          leftPaneWidth.value = clamp(
            event.clientX - VISUALIZER_CONSTANTS.viewport.pageHorizontalPadding,
            minLeft,
            maxLeft,
          )
          drawGallery()
        }

        function stopResize() {
          resizing.value = false
          document.body.classList.remove('is-resizing')
          window.removeEventListener('pointermove', onPointerMove)
          window.removeEventListener('pointerup', stopResize)
        }

        function startResize(event) {
          if (window.innerWidth <= DESKTOP_BREAKPOINT) {
            return
          }
          event.preventDefault()
          resizing.value = true
          document.body.classList.add('is-resizing')
          window.addEventListener('pointermove', onPointerMove)
          window.addEventListener('pointerup', stopResize)
        }

        function resetSplit() {
          leftPaneWidth.value = calculateDefaultSplit()
          drawGallery()
        }

        function onWindowResize() {
          if (window.innerWidth > DESKTOP_BREAKPOINT) {
            const { minLeft, maxLeft } = calculateBounds()
            leftPaneWidth.value = clamp(leftPaneWidth.value, minLeft, maxLeft)
          }
          if (cameraControlledByNotebook.value) {
            queueGraphRefresh()
            drawGallery()
            return
          }
          fitCameraToWorld(false)
          drawGallery()
        }

        async function loadNotebook() {
          try {
            const response = await fetch(NOTEBOOK_URL, { cache: 'no-store' })
            if (!response.ok) {
              throw new Error(`Failed to load ${NOTEBOOK_URL}: ${response.status}`)
            }
            const data = await response.json()
            if (!data || typeof data !== 'object' || !Array.isArray(data.cells)) {
              throw new Error('Invalid notebook format')
            }
            notebook.value = data
            notebookLoaded.value = true
          } catch (error) {
            console.error(error)
          }
        }

        function onCanvasPointerDown(event) {
          if (event.button !== 0) {
            return
          }

          const world = pointerWorldPosition(event)
          if (world) {
            const hit = findNodeAtWorldPosition(world.x, world.y)
            if (hit && hit.graph?.render) {
              activeNodeDrag.value = {
                pointerId: event.pointerId,
                graphUid: hit.graph.uid,
                graphName: hit.graph.name,
                nodeUid: hit.node.uid,
                nodeId: hit.node.id,
                nodeIndex: Number.isInteger(hit.node.nodeIndex) ? hit.node.nodeIndex : null,
                grabDX: world.x - hit.node.x,
                grabDY: world.y - hit.node.y,
                worldX: hit.node.x,
                worldY: hit.node.y,
              }
              isPanningCamera.value = false
              if (event.currentTarget && typeof event.currentTarget.setPointerCapture === 'function') {
                event.currentTarget.setPointerCapture(event.pointerId)
              }
              return
            }
          }

          activeNodeDrag.value = null
          isPanningCamera.value = true
          lastPointerX = event.clientX
          lastPointerY = event.clientY
          if (event.currentTarget && typeof event.currentTarget.setPointerCapture === 'function') {
            event.currentTarget.setPointerCapture(event.pointerId)
          }
        }

        function onCanvasPointerMove(event) {
          if (activeNodeDrag.value) {
            if (activeNodeDrag.value.pointerId !== event.pointerId) {
              return
            }
            const world = pointerWorldPosition(event)
            if (!world) {
              return
            }

            const drag = activeNodeDrag.value
            drag.worldX = world.x - drag.grabDX
            drag.worldY = world.y - drag.grabDY

            const updated = updateNodePositionInRender(drag)
            if (updated) {
              queueNodePosSync(updated, VISUALIZER_CONSTANTS.sync.nodeDragSyncMs)
            }

            drawGallery()
            return
          }

          if (!isPanningCamera.value) {
            return
          }
          const dx = event.clientX - lastPointerX
          const dy = event.clientY - lastPointerY
          lastPointerX = event.clientX
          lastPointerY = event.clientY
          cameraOffsetX.value += dx
          cameraOffsetY.value += dy
          hasMovedCamera.value = true
          notebookCameraOverrideUntil = Date.now() + VISUALIZER_CONSTANTS.sync.notebookCameraOverrideMs
          drawGallery()
          queueNotebookCameraSync(VISUALIZER_CONSTANTS.sync.notebookCameraSyncMs)
        }

        function onCanvasPointerUp(event) {
          if (activeNodeDrag.value) {
            if (activeNodeDrag.value.pointerId !== event.pointerId) {
              return
            }
            const drag = activeNodeDrag.value
            activeNodeDrag.value = null

            const updated = updateNodePositionInRender(drag)
            if (updated) {
              queueNodePosSync(updated, 0)
            }

            if (event.currentTarget && typeof event.currentTarget.releasePointerCapture === 'function') {
              try {
                event.currentTarget.releasePointerCapture(event.pointerId)
              } catch {
                // Ignore release errors when pointer capture has already ended.
              }
            }
            return
          }

          if (!isPanningCamera.value) {
            return
          }
          isPanningCamera.value = false
          if (event.currentTarget && typeof event.currentTarget.releasePointerCapture === 'function') {
            try {
              event.currentTarget.releasePointerCapture(event.pointerId)
            } catch {
              // Ignore release errors when pointer capture has already ended.
            }
          }
          notebookCameraOverrideUntil = Date.now() + VISUALIZER_CONSTANTS.sync.notebookCameraOverrideMs
          queueNotebookCameraSync()
        }

        function onCanvasWheel(event) {
          const canvas = viewerCanvasRef.value
          if (!canvas) {
            return
          }

          const rect = canvas.getBoundingClientRect()
          const localX = event.clientX - rect.left
          const localY = event.clientY - rect.top
          const worldX = (localX - cameraOffsetX.value) / cameraScale.value
          const worldY = (localY - cameraOffsetY.value) / cameraScale.value

          const factor = Math.exp(-event.deltaY * VISUALIZER_CONSTANTS.zoom.wheelFactor)
          const nextScale = clamp(
            cameraScale.value * factor,
            VISUALIZER_CONSTANTS.zoom.scaleMin,
            VISUALIZER_CONSTANTS.zoom.scaleMax,
          )
          if (nextScale === cameraScale.value) {
            return
          }

          cameraScale.value = nextScale
          cameraOffsetX.value = localX - worldX * nextScale
          cameraOffsetY.value = localY - worldY * nextScale
          hasMovedCamera.value = true
          notebookCameraOverrideUntil = Date.now() + VISUALIZER_CONSTANTS.sync.notebookCameraOverrideMs
          drawGallery()
          queueNotebookCameraSync(VISUALIZER_CONSTANTS.sync.notebookCameraSyncMs)
        }

        function resetGraphCamera() {
          if (cameraControlledByNotebook.value) {
            queueGraphRefresh()
            return
          }
          hasMovedCamera.value = false
          fitCameraToWorld(true)
          drawGallery()
        }

        function onKernelReady(payload) {
          pyodideRef.value = payload?.pyodide ?? null
          kernelReady.value = true
          queueGraphRefresh()
        }

        async function flushPendingNodePosThenRefresh(delayMs = 0) {
          queueGraphRefresh(delayMs)
          if (pendingNodePosUpdates.size > 0) {
            // Do not block the first post-cell refresh on node-pos synchronization:
            // startup pending sync can take long enough to consume short animations.
            void flushPendingNodePosSync(3)
          }
        }

        function onCellComplete() {
          queueAnimationPlayback(0, {
            probeFrames: VISUALIZER_CONSTANTS.sync.animationPlaybackProbeFrames,
          })
          void flushPendingNodePosThenRefresh()
        }

        function onWorkspaceSync(payload) {
          if (payload && payload.mode === 'always-live') {
            queueAnimationPlayback(0, {
              probeFrames: VISUALIZER_CONSTANTS.sync.animationPlaybackProbeFrames,
            })
            void flushPendingNodePosThenRefresh(VISUALIZER_CONSTANTS.sync.workspaceSyncRefreshMs)
          }
        }

        const pageStyle = computed(() => ({
          '--left-pane-width': `${leftPaneWidth.value}px`,
        }))

        onMounted(() => {
          if (window.innerWidth > DESKTOP_BREAKPOINT) {
            leftPaneWidth.value = calculateDefaultSplit()
          }
          window.addEventListener('resize', onWindowResize)
          void loadNotebook()
          resetGraphCamera()
        })

        onBeforeUnmount(() => {
          isComponentAlive = false
          // Overlay/cache cleanup is explicit because labels are DOM nodes outside canvas state.
          clearNodeLabelOverlay()
          latexLabelMarkupCache.clear()
          stopResize()
          window.removeEventListener('resize', onWindowResize)
          graphRefreshJob.cancel()
          cameraSyncJob.cancel()
          animationPlaybackJob.cancel()
          nodePosSyncJob.cancel()
          cancelEdgePathTransitionFrame()
        })

        return {
          notebook,
          editorTheme,
          pageStyle,
          startResize,
          resetSplit,
          viewerCanvasRef,
          nodeLabelOverlayRef,
          vuepyterRef,
          isPanningCamera,
          onCanvasPointerDown,
          onCanvasPointerMove,
          onCanvasPointerUp,
          onCanvasWheel,
          resetGraphCamera,
          onKernelReady,
          onCellComplete,
          onWorkspaceSync,
        }
      },
      template: `
          <main class="page" :style="pageStyle">
            <section class="left-pane">
              <section class="left-pane-card" aria-label="Graph visualizer">
                <canvas
                  ref="viewerCanvasRef"
                  class="graph-canvas"
                  :class="{ 'is-panning': isPanningCamera }"
                  @wheel.prevent="onCanvasWheel"
                  @pointerdown="onCanvasPointerDown"
                  @pointermove="onCanvasPointerMove"
                  @pointerup="onCanvasPointerUp"
                  @pointercancel="onCanvasPointerUp"
                  @pointerleave="onCanvasPointerUp"
                  @dblclick="resetGraphCamera"
                />
                <div
                  ref="nodeLabelOverlayRef"
                  class="graph-label-overlay"
                  aria-hidden="true"
                />
              </section>
            </section>

            <div
              class="splitter"
              role="separator"
              aria-label="Resize panes"
              aria-orientation="vertical"
              @pointerdown="startResize"
              @dblclick="resetSplit"
            />

            <section class="right-pane">
              <Vuepyter
                ref="vuepyterRef"
                class="editor-fill"
                v-model="notebook"
                :autosave-interval="1000"
                :theme="editorTheme"
                @ready="onKernelReady"
                @workspace:sync="onWorkspaceSync"
                @cell:complete="onCellComplete"
              />
            </section>
          </main>
        `,
    })

    app.mount('#app')
  </script>
</body>

</html>
